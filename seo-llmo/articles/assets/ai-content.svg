<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">AIで書いた記事を公開するまで</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">Googleは作り方ではなく、内容の質で評価すると説明</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">企画</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">自社にしか</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">書けない情報を</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">先に決める</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">下書き</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">AIで構成と</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">下書きを作り、</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">参照元を記録</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">事実確認</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">固有名詞・数字・</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">日付を原文で</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">人が確かめる</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">表示</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">題名・説明文・</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">構造化データも</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">照合、署名を付ける</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">価値を加えずに大量のページを作り、順位を操作するのはスパムポリシー違反</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">公開前の手作業の事実確認が前提。題名・説明文・構造化データ・代替テキストも対象</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">Google 検索セントラル（生成AIコンテンツのガイダンス、スパムに関するポリシー。2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>