<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">SEOの見積書は4つに分けて読む</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">同じ月額でも、含まれる範囲が違えば比べられない</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">記事制作</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">本数・文字数</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">構成・執筆・編集</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">入稿・画像・修正</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">記事以外の作業</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">記事計画・リライト</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">内部対策（実装か）</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">レポート・定例</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">費用の種類</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">初期費用・月額</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">単発の作業の単価</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ツール費などの実費</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="903.5" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">契約条件</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">最低期間・解約通知</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果物の権利</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">アカウントの名義</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">最低契約期間の総額と、空欄が残る項目で比べる（当社の提案）</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">Googleは順位の保証に注意を促し、監査ではSearch Consoleの読み取りの権限だけを渡すよう勧める</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">Google 検索セントラル「Do you need an SEO?」（2026年11月4日確認）と当社の整理をもとに作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>