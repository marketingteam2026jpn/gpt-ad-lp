<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">会社・サービス・人物・FAQの構造化データ</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">見える情報と一致させる。AI向けの特別なマークアップはない（Google）</text><rect x="306" y="228" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="261" fill="#fff" font-size="21" font-weight="700" text-anchor="start">使う型（schema.org）</text><rect x="727" y="228" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="261" fill="#fff" font-size="21" font-weight="700" text-anchor="start">置く場所・注意</text><rect x="64" y="288" width="230" height="52" rx="10" fill="#F5F6F9"/><text x="82" y="321.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">会社</text><rect x="306" y="288" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="326" y="321.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Organization</text><rect x="727" y="288" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="747" y="309.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">トップか会社概要に1つ。</text><text x="747" y="333.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">名前はサイト名と同じに</text><rect x="64" y="346" width="230" height="52" rx="10" fill="#F5F6F9"/><text x="82" y="379.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">サービス</text><rect x="306" y="346" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="326" y="379.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Service</text><rect x="727" y="346" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="747" y="367.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">サービスのページに。Googleの</text><text x="747" y="391.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">専用の表示機能はない</text><rect x="64" y="404" width="230" height="52" rx="10" fill="#F5F6F9"/><text x="82" y="437.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">人物</text><rect x="306" y="404" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="326" y="425.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">記事のauthor（Person）</text><text x="326" y="449.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">と著者のProfilePage</text><rect x="727" y="404" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="747" y="425.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">主題が1人のページ。</text><text x="747" y="449.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">実在し内容を確かめた人だけ</text><rect x="64" y="462" width="230" height="52" rx="10" fill="#F5F6F9"/><text x="82" y="495.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">FAQ</text><rect x="306" y="462" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="326" y="495.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">FAQPage</text><rect x="727" y="462" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="747" y="483.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">Google検索のFAQの表示は</text><text x="747" y="507.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">2026年5月7日に終了</text><rect x="64" y="530" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="574" fill="#fff" font-size="25" font-weight="700" text-anchor="start">Googleは生成AI検索に構造化データは必須でなく、特別なschema.orgもないと説明</text><text x="96" y="608" fill="#fff" font-size="21" font-weight="500" text-anchor="start">Microsoftはスキーマを勧めるが、選ばれる保証はないと説明。どちらも効果の大きさは示していない</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">Google 検索セントラル、schema.org、Microsoft Advertising の公式ブログ（2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>