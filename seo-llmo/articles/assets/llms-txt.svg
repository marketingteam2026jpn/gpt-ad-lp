<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">似た名前の3つのファイルの違い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">llms.txtは、アクセスの許可・拒否の仕組みではない</text><rect x="64" y="250" width="345" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">robots.txt</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">アクセスの可否</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クローラーに、どのアクセスが</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">許容されるかを示す。</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">多くの事業者が従うと書く</text><path d="M412 369 L424 369" stroke="#E1E4EB" stroke-width="3"/><rect x="427" y="250" width="345" height="238" rx="20" fill="#F5F6F9"/><text x="449.3333333333333" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">sitemap.xml</text><text x="449.3333333333333" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">ページの一覧</text><text x="449.3333333333333" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">索引に登録できる</text><text x="449.3333333333333" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">人向けのページを並べる。</text><text x="449.3333333333333" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">検索エンジンが読む</text><path d="M776 369 L788 369" stroke="#E1E4EB" stroke-width="3"/><rect x="791" y="250" width="345" height="238" rx="20" fill="#FFF1EA"/><text x="812.6666666666666" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">llms.txt</text><text x="812.6666666666666" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">AI向けの案内（提案）</text><text x="812.6666666666666" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">サイトの概要と主要なページ</text><text x="812.6666666666666" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">をMarkdownで示す。</text><text x="812.6666666666666" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">読むと明言した主要事業者は未確認</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">Google検索はllms.txtを使わない（表示・順位に良くも悪くも影響しない）</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">Chromeの開発者向けツールは、実験的な点検で置いてあるかを確かめる（置くのは任意）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">llmstxt.orgの提案、Google 検索セントラル、Chrome for Developers（2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>