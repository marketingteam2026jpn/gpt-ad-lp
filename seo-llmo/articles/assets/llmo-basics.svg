<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">AIの回答に自社のページが使われるまで</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">Googleは「AI機能のための特別な最適化は不要」と説明</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">読まれる</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">robots.txt・CDN</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">で検索用の</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クローラーを許可</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">索引に入る</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">索引に登録され、</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">スニペット表示可。</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">生成AI設定で除外なし</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">選ばれる</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">質問に合う、</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">自社にしか</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">書けない情報</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">測る</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">生成AIの表示回数、</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">参照元の流入、</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">質問を決めた確認</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">土台はSEOと同じ。違うのは、成果の形（言及・引用）と測り方</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">回答の文面は管理できない。管理できるのは、使うことを許すかと、自社の情報の中身</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">Google 検索セントラル、Search Console ヘルプ、OpenAIの資料（2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>