<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">SEO・LLMO外注の料金の形は4つ</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">何を頼むかで桁が変わる。相場は1つに決まらない</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">記事単価</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">文字数・工程・</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">確認・修正の範囲</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">で単価が変わる</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">月額の運用</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">記事の本数と、</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">実装まで行うか</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">で中身が変わる</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">単発の作業</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">診断・設計・調査。</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">実装やその後の</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">支援は別のことも</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="903.5" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">LLMOのメニュー</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">診断・計測・整備。</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">SEOと重なる作業</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">がどれかを確かめる</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">比べるのは月額ではなく、範囲・最低契約期間・税の表記をそろえた総額</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">Googleは生成AI検索の最適化もSEOと説明。追加になりやすいのは定点計測と直し（当社の見解）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">SEO支援会社4社の公式の料金ページ、Google 検索セントラル（2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>