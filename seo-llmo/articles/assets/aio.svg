<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">AIによる概要とAIモード</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">どちらも特別な最適化は不要。違うのは出方と数え方</text><rect x="306" y="228" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="261" fill="#fff" font-size="21" font-weight="700" text-anchor="start">AIによる概要（AI Overviews）</text><rect x="727" y="228" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="261" fill="#fff" font-size="21" font-weight="700" text-anchor="start">AIモード（AI Mode）</text><rect x="64" y="288" width="230" height="52" rx="10" fill="#F5F6F9"/><text x="82" y="321.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">出る場所</text><rect x="306" y="288" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="326" y="321.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">通常の検索結果の中</text><rect x="727" y="288" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="747" y="309.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">google.com/ai、検索画面</text><text x="747" y="333.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">の「AIモード」など</text><rect x="64" y="346" width="230" height="52" rx="10" fill="#F5F6F9"/><text x="82" y="379.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">出るとき</text><rect x="306" y="346" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="326" y="367.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">役立つとシステムが</text><text x="326" y="391.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">判断したときだけ</text><rect x="727" y="346" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="747" y="367.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">利用者がAIモードで</text><text x="747" y="391.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">質問したとき</text><rect x="64" y="404" width="230" height="52" rx="10" fill="#F5F6F9"/><text x="82" y="437.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">日本での提供</text><rect x="306" y="404" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="326" y="437.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">提供国・言語の一覧に日本・日本語</text><rect x="727" y="404" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="747" y="437.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">提供国・言語の一覧に日本・日本語</text><rect x="64" y="462" width="230" height="52" rx="10" fill="#F5F6F9"/><text x="82" y="495.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">掲載順位</text><rect x="306" y="462" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="326" y="483.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">概要全体で1つの位置</text><text x="326" y="507.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（中のリンクは同じ順位）</text><rect x="727" y="462" width="409" height="52" rx="10" fill="#F5F6F9"/><text x="747" y="483.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">通常の検索結果と同じ方法</text><text x="747" y="507.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（追加の質問は新しい検索）</text><rect x="64" y="530" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="574" fill="#fff" font-size="25" font-weight="700" text-anchor="start">条件は、索引登録とスニペット表示、Search Consoleの生成AIの設定</text><text x="96" y="608" fill="#fff" font-size="21" font-weight="500" text-anchor="start">出したくないときは、生成AIの設定（サイト全体）、nosnippet（ページ）。Google-Extendedでは外れない</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">Google 検索ヘルプ、Search Console ヘルプ、Google 検索セントラル（2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>