<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">AIでの見え方は段階で分けて測る</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">表示・言及、引用、流入、成果で、測る手段が違う</text><rect x="64" y="236" width="480" height="56" rx="10" fill="#FF5A1F"/><text x="84" y="272.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">1. 表示・言及</text><text x="568" y="271.0" fill="#9E3000" font-size="17" font-weight="700" text-anchor="start">Search Console（Googleの表示回数）、定点確認</text><rect x="64" y="300" width="413" height="56" rx="10" fill="#10131A"/><text x="84" y="336.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">2. 引用（出典のリンク）</text><text x="568" y="335.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Bing Webmaster Tools（引用の回数）、定点確認</text><rect x="64" y="364" width="346" height="56" rx="10" fill="#10131A"/><text x="84" y="400.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">3. 流入（クリック）</text><text x="568" y="399.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Search Console（クリック）、GA4のAIアシスタント</text><rect x="64" y="428" width="278" height="56" rx="10" fill="#10131A"/><text x="84" y="464.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">4. 成果</text><text x="568" y="463.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">GA4のキーイベント（広告の流入は分ける）</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">ChatGPT・Perplexity・Claudeでの表示回数を見る公式の画面は、確認できなかった</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">GoogleのAIによる概要からの流入は、GA4では「オーガニック検索」に入る</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">Search Console ヘルプ、Google アナリティクス ヘルプ、Bingの公式ブログ（2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>