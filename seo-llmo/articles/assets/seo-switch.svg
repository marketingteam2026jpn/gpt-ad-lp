<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">SEO会社の乗り換えの4段階</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">守るのは、記事のURLと、計測・CMSの権限</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">契約を確かめる</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">解約の通知期限</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">記事の削除の定め</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果物の権利</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="358.5" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">権限を自社に</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Search Console・</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">GA4・GTM・CMSを</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">自社の管理者で</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">一覧を受け取る</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">記事・URL・</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">リダイレクト・</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">構造化データの設定</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">切り替えて点検</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">旧会社の権限と</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">確認トークンを削除</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">流入と索引を監視</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">URLを変えなければ移転の手順の対象外。変えるなら301・308を一般に1年以上</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">流入が落ちるのは、URL・記事・設定・計測が変わったとき（当社の見解）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">Google 検索セントラル、Search Console ヘルプ、Google アナリティクス ヘルプ（2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>