<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">AIクローラーは名前で分けて設定する</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">学習用と検索・回答用は、多くの事業者で別々に指定できる</text><rect x="306" y="214" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="247" fill="#fff" font-size="21" font-weight="700" text-anchor="start">学習に使う名前</text><rect x="727" y="214" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="747" y="247" fill="#fff" font-size="21" font-weight="700" text-anchor="start">検索・回答に使う名前</text><rect x="64" y="274" width="230" height="44" rx="10" fill="#F5F6F9"/><text x="82" y="303.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">OpenAI</text><rect x="306" y="274" width="409" height="44" rx="10" fill="#F5F6F9"/><text x="326" y="303.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">GPTBot</text><rect x="727" y="274" width="409" height="44" rx="10" fill="#FFF1EA"/><text x="747" y="303.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">OAI-SearchBot</text><rect x="64" y="324" width="230" height="44" rx="10" fill="#F5F6F9"/><text x="82" y="353.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">Google</text><rect x="306" y="324" width="409" height="44" rx="10" fill="#F5F6F9"/><text x="326" y="353.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Google-Extended ※</text><rect x="727" y="324" width="409" height="44" rx="10" fill="#FFF1EA"/><text x="747" y="353.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Googlebot（AIによる概要も）</text><rect x="64" y="374" width="230" height="44" rx="10" fill="#F5F6F9"/><text x="82" y="403.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">Anthropic</text><rect x="306" y="374" width="409" height="44" rx="10" fill="#F5F6F9"/><text x="326" y="403.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">ClaudeBot</text><rect x="727" y="374" width="409" height="44" rx="10" fill="#FFF1EA"/><text x="747" y="403.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Claude-SearchBot</text><rect x="64" y="424" width="230" height="44" rx="10" fill="#F5F6F9"/><text x="82" y="453.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">Apple</text><rect x="306" y="424" width="409" height="44" rx="10" fill="#F5F6F9"/><text x="326" y="453.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Applebot-Extended ※</text><rect x="727" y="424" width="409" height="44" rx="10" fill="#FFF1EA"/><text x="747" y="453.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Applebot</text><rect x="64" y="474" width="230" height="44" rx="10" fill="#F5F6F9"/><text x="82" y="503.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">Perplexity</text><rect x="306" y="474" width="409" height="44" rx="10" fill="#F5F6F9"/><text x="326" y="503.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">学習用の名前の記載なし</text><rect x="727" y="474" width="409" height="44" rx="10" fill="#FFF1EA"/><text x="747" y="503.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">PerplexityBot</text><rect x="64" y="524" width="230" height="44" rx="10" fill="#F5F6F9"/><text x="82" y="553.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">Microsoft</text><rect x="306" y="524" width="409" height="44" rx="10" fill="#F5F6F9"/><text x="326" y="541.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">__usage_ai-training ※</text><text x="326" y="565.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（2027年2月1日から尊重）</text><rect x="727" y="524" width="409" height="44" rx="10" fill="#FFF1EA"/><text x="747" y="541.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">Bingbot</text><text x="747" y="565.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（根拠の指定はページ単位）</text><rect x="64" y="592" width="1072" height="62" rx="12" fill="#10131A"/><text x="96" y="636" fill="#fff" font-size="25" font-weight="700" text-anchor="start">利用者の操作で取りに来る名前には、robots.txtが当てはまらないことがある</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">※ クロールはせず、使い道だけを指定する名前。各社の公式資料（2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>