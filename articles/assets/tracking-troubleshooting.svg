<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">計測のトラブルは4つの段階で切り分ける</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">1件の行動の時刻とイベントIDを記録し、止まった段階から直す</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">送られたか</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">コンソールと通信で</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">リクエストを見る。</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">発火の表示では不足</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">受け付けられたか</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">応答コードと文面を</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">残す。エラーは</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">待たずにすぐ調べる</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">届いたか</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">正しいデータソースか。</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">利用できる場合は</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">直近のイベントで確認</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">計上されたか</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果イベントの設定、</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">紐づけた時期、帰属</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">期間と見ている列</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">送られていないなら、レポートを待っても直らない</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">受け付けられても計上されたとは限らない。新しいIDで送り直さず、設定と帰属を確かめる</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターと開発者向けドキュメント（2026年10月29日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>