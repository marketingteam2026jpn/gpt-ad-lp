<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">Ads ManagerとGA4の数字の違い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">GA4を接続しても、取り込まれる合計は広告の成果ではない</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">Ads Managerの成果</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">接続で取り込むGA4の数</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">数える範囲</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="302.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">ChatGPT広告に結びつけられた</text><text x="326" y="326.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果イベント</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="302.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">プロパティ全体・すべての</text><text x="747" y="326.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">流入元のイベント</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">帰属</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="354.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">ラストタッチ。クリック7・14・30日、</text><text x="326" y="378.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ビュー0日か1日</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">GA4側の設定による</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">日の区切り</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">広告アカウントのタイムゾーン</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">GA4プロパティのタイムゾーン</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">更新</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="470.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">成果の反映に24〜48時間ほど</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">1日ごとに更新。初回は直近</text><text x="747" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">30日分（当日を除く）</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">主な使いどころ</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">媒体内の比較と</text><text x="326" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">配信の最適化</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">帰属の比較と、対象となる</text><text x="747" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">場合の最適化（ヘルプの記載）</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">比べるときは、同じ期間・タイムゾーン・成果の定義にそろえる</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">Ads Managerのクリック経由と、GA4でChatGPT広告のUTMに絞った成果を比べる</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンター（2026年10月29日確認）をもとに当社作成。使いどころの左列は当社の見解。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>