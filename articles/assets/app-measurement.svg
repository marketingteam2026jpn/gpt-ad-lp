<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">アプリのインストール計測の流れ</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">アプリ用SDKは未対応。MMP連携かサーバーからの送信で測る</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告のクリック</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ChatGPTの</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">iOS・Androidの</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">アプリやWebで</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">MMPのリンク</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">MMPで作った</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クリックURLを</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">リンク先に置く</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">インストール</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ストアなどを</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">経由して入手し、</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">起動する</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="740.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">MMPが送信</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">WebのPixel IDと</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">APIキーを使い</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">イベントを送る</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">Ads Manager</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Conversionsに計上</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">反映は24〜48時間</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">帰属はクリック基準</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">iOSの広告ID（IDFA）は非対応。MMPとAds Managerの帰属期間は別に設定する。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">アプリストアへのリンクは審査で内容が読めないことがある。審査の前に転送先を確かめる。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">配信面の iOS app・Android app は、ChatGPTのアプリでの表示を指します。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターと開発者向けドキュメント（2026年10月7日確認）をもとに当社作成。MMP連携の動作は未確認です。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>