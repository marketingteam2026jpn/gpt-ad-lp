<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">ChatGPT広告の入稿規定の早見表</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">ヘルプ・管理画面・開発者向け資料に分かれた規定を1枚に</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">公式の規定</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">入稿前に確かめること（当社の見解）</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">タイトル</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="302.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">推奨16〜24文字</text><text x="326" y="326.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">上限50文字</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="302.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">大事な言葉は前半16字に</text><text x="747" y="326.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">プレビューで省略の位置を確認</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">説明文</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="354.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">推奨32〜48文字</text><text x="326" y="378.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">上限100文字</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="354.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">タイトルに無い情報を足す</text><text x="747" y="378.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">2行ほどで切れる前提で書く</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">画像</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">PNG・JPG、正方形</text><text x="326" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">1200×1200以下（ヘルプ）</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">1200×1200で作れば</text><text x="747" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">管理画面・APIの条件にも合う</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">ブランド名・ロゴ</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">設定→一般で登録</text><text x="326" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">変更するとブランド審査</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">配信開始の前に確定する</text><text x="747" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">LPの表記とそろえる</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">リンク先URL</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">有効で到達できること</text><text x="326" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">OAI-AdsBotを止めない</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">ログインやアプリが不要なページ</text><text x="747" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">転送でUTM・opprefを残す</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">上限は「入力できる長さ」。表示される長さはプレビューで確かめる。</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">資料ごとに書き方が違う項目は、最も厳しい条件に合わせて素材を作る。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンター・開発者向けドキュメント・広告ポリシーと、当社の画面での確認をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>