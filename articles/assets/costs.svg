<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">最低日予算とCPCは、別の数字</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">開始に必要な予算と、クリックにかかった費用を分けて確認する</text><rect x="64" y="237" width="364" height="370" rx="20" fill="#FFF1EA"/><text x="96" y="290" fill="#9E3000" font-size="27" font-weight="700">公式の最低日予算</text><text x="96" y="378" fill="#10131A" font-size="72" font-weight="700">2,500</text><text x="322" y="378" fill="#10131A" font-size="33" font-weight="500">円</text><text x="96" y="433" fill="#10131A" font-size="26" font-weight="500">日ごとの平均予算</text><text x="96" y="488" fill="#4E5766" font-size="22" font-weight="500">1日の厳密な上限ではない</text><text x="96" y="527" fill="#4E5766" font-size="22" font-weight="500">検証に使う総額は別に決める</text><rect x="452" y="237" width="684" height="370" rx="20" fill="#F5F6F9"/><text x="484" y="290" fill="#10131A" font-size="27" font-weight="700">国内2事例の平均CPC</text><text x="484" y="346" fill="#10131A" font-size="23" font-weight="500">Shinker</text><rect x="484" y="367" width="85" height="32" rx="5" fill="#5B62F0"/><text x="590" y="395" fill="#343BC0" font-size="34" font-weight="700">79円</text><text x="484" y="452" fill="#10131A" font-size="23" font-weight="500">デジタルアスリート</text><rect x="484" y="472" width="470" height="32" rx="5" fill="#5B62F0"/><text x="980" y="501" fill="#343BC0" font-size="34" font-weight="700">435円</text><text x="484" y="565" fill="#4E5766" font-size="22" font-weight="500">広告費 ÷ クリック数。異なる配信条件の実測値。</text><text x="64" y="650" fill="#4E5766" font-size="24" font-weight="500">79〜435円は2社の公表値の幅です。業種別の相場・成果の保証ではありません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月15日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>