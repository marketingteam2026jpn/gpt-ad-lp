<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">運用チェックの4つの頻度</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">日次は止まっていないか。成果は週次で読む（当社の提案）</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">日次</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">止まっていないか</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">状態と通知メール</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示回数とクリック</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算週の消化</text><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">週次</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">成果と計測の質</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">直近2日を除く成果</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">イベント品質</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">国・LP・フィード</text><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">月次</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">請求・権限・方針</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">請求とレポートの照合</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">役割とキーの棚卸し</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ポリシーの版</text><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">変更時</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">戻せない設定</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">目的・課金・成果</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">名前の変更は審査</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">保存後に開き直す</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">頻度は、数字が反映される速さに合わせる</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">表示・クリックは約15分、消化額は約7〜8時間、成果は24〜48時間が目安（ヘルプ）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプ（Measure Results・Daily Budgets・Billing ほか）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>