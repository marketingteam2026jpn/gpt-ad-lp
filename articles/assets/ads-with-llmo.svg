<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">広告とLLMOを併用するときの分け方</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">仕組みは別。サイト・クローラー・計測は共通</text><rect x="306" y="214" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="247" fill="#fff" font-size="21" font-weight="700" text-anchor="start">ChatGPT広告</text><rect x="727" y="214" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="247" fill="#fff" font-size="21" font-weight="700" text-anchor="start">LLMO（回答の中の言及）</text><rect x="64" y="274" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="305.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">サイトを読む</text><rect x="306" y="274" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="293.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">OAI-AdsBot</text><text x="326" y="317.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（LPの確認。許可は必須）</text><rect x="727" y="274" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="293.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">OAI-SearchBot（検索の結果）</text><text x="747" y="317.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">学習はGPTBotで別に設定</text><rect x="64" y="328" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="359.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">役割（当社の提案）</text><rect x="306" y="328" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="347.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">決める段階・期間限定で</text><text x="326" y="371.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">届けたい場面に接点を作る</text><rect x="727" y="328" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="347.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">基礎・比較の出典になる</text><text x="747" y="371.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">有料プランの利用者にも届く</text><rect x="64" y="382" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="413.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">予算</text><rect x="306" y="382" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="401.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">広告費（日予算・総額予算）</text><text x="326" y="425.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">停止後も最大24時間は表示され得る</text><rect x="727" y="382" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="401.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">制作・改善の工数</text><text x="747" y="425.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告費はかからない</text><rect x="64" y="436" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="467.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">GA4の見え方</text><rect x="306" y="436" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="455.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">広告専用のUTMで</text><text x="326" y="479.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">有料のチャネルへ</text><rect x="727" y="436" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="455.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">参照元でAIアシスタントへ</text><text x="747" y="479.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（2026年5月13日から）</text><rect x="64" y="490" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="521.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">報告</text><rect x="306" y="490" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="509.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">広告費・クリック・</text><text x="326" y="533.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Ads Managerの成果</text><rect x="727" y="490" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="509.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">AIアシスタントの流入・</text><text x="747" y="533.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">定点確認の結果</text><rect x="64" y="556" width="1072" height="92" rx="12" fill="#10131A"/><text x="96" y="600" fill="#fff" font-size="25" font-weight="700" text-anchor="start">広告は回答に影響しない。共通なのはサイト・クローラー・計測</text><text x="96" y="634" fill="#fff" font-size="21" font-weight="500" text-anchor="start">質問の一覧・クローラーの方針・UTMの規則は1つにし、数字は足し合わせない（当社の提案）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプ・クローラーの資料とGoogleアナリティクスのヘルプ（2026年11月4日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>