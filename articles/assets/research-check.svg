<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">公開事例を確かめる5つの手順</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">紹介記事や転載の数字は、原典までたどってから使う</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">原典を特定</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告主・運用会社・</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">OpenAIの</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">最初の発表</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">日付を分ける</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">公開日と</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">対象期間は別</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">時系列の矛盾は？</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">条件を抜き出す</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">期間・比較相手</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果の定義</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">計測の方法</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">画面と照合</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">本文と画面の</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">数字は合うか</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">載っていない数字</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">重複を除く</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">同じテストは1件</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">説明用の仮の数字</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">は実績ではない</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">公式の広告ライブラリは確認範囲で見当たらない。第三者のライブラリは観測した標本。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">件数を市場規模と読まない。載っていないことは出稿していない証拠ではない。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">当社作成。第三者サービスの説明は2026年9月25日時点の各社の記載です。当社はこれらのサービスと提携していません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>