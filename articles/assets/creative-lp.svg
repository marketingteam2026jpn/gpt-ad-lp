<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">相談場面から、広告とLPを1本の線にそろえる</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">1つの広告グループ＝1つの相談場面。場面が違えばグループを分ける</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">相談場面</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">誰が、何に</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">迷っているか</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">を1つ選ぶ</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">ヒント</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">何を・誰に・</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">いつ役立つか</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">を補足する</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告文・画像</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">具体的な便益を</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">角度を変えて</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">複数用意する</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">LP</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">相談に最も近い</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ページへ送る</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">約束を1画面目に</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">計測する行動</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予約・送信など</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">完了の時点で</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">イベントを送る</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">LPはトップページではなく、相談内容に最も近いページへ。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">画像やLPの効果は、配信量と比較条件がそろわないと断定できない。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">変えるのは1回に1要素。広告ごとのクリックが100件に届くまで優劣を判断しない（当社の提案）。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの作成ガイドと公開事例をもとに当社作成。事例は他社の公開情報で、当社の運用実績ではありません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>