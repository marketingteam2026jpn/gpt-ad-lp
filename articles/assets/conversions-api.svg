<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">PixelとConversions APIの違い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">CAPIはPixelを補うもの。両方で送るならイベントIDをそろえる</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">Pixel（ブラウザ）</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">Conversions API（サーバー）</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">送る場所</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">利用者のブラウザ</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">自社のサーバー</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">向く成果</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">サイト上の閲覧・送信・購入</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">サーバーで確定した注文など</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">クリックの参照値</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">URLのopprefを自動で取り、</text><text x="326" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Cookieに保存する</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">自動では取らない。</text><text x="747" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">受け取って一緒に送る</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">必要なもの</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">Pixel ID</text><text x="326" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（ブラウザにキーは不要）</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">Pixel IDとConversions APIの</text><text x="747" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">キー（サーバーで保管）</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">アプリのイベント</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">送れない</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">送れる（action_sourceを</text><text x="747" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">mobile_appにする）</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">同じ成果を両方で送るときは、Pixel ID・イベント名・イベントIDをそろえる</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">最初に届いた1件が使われ、後の重複は無視される。再送も同じIDと元の時刻で</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの開発者向けドキュメントとヘルプセンター（2026年10月29日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>