<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">計測パートナーの5つの役割</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">連携でできることはパートナーごとに違う。日本での提供は未確認</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">成果を送る</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">既存の仕組みの</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果をChatGPT</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告へ届ける</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">帰属</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果を割り当てる</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告・媒体を決める</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">アプリのMMPも</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">全体の推計</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">媒体全体での</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">貢献を推計する</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">前提はモデル</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="740.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">増分</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告で増えた分</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">地域の実験は</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">初期段階</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">ブランド指標</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ブランドへの</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">反応を測る</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">初期のテスト</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">Ads Managerの成果はラストタッチの数。マルチタッチではない</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">広告がなければ起きなかった成果かは、帰属の数では分からない。増分は実験で測る</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプ（Measurement Partner Integrations ほか）と2026年10月5日のAds Blogをもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>