<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">カスタムオーディエンスの作成から使うまで</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">自社の顧客リストから作り、キャンペーンと広告グループで使う</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">データを確かめる</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">自社で集めたデータ</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">通知・同意を確認</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">禁止データを含めない</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">ファイルを整える</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">UTF-8のCSVかTXT</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">電話はE.164（+81〜）</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ハッシュはSHA-256</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">作成して待つ</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Tools → Audiences</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">処理は通常20〜30分</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">行数と一致数は違う</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="903.5" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">使い方を選ぶ</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">除外：規模の下限なし</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">包含：一致2.5万人〜</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">入札調整：一致2.5万人〜</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">除外は小さなリストでも使える。包含と入札調整は一致25,000人から</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">ヘルプの推奨は10万人以上。行数ではなく、一致した人数（状態の注記）で判断する</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">EEA・スイスを対象にするキャンペーンでは使わないよう案内されています。日本での提供は未確認です。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンター・開発者向けドキュメント・Ad Tools Terms（2026年10月29日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>