<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">SaaSの成果の置き方は、売り方で分ける</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">最適化は件数が見込める段階を1つ。その先は計測で追う（当社の提案）</text><rect x="306" y="214" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="247" fill="#fff" font-size="21" font-weight="700" text-anchor="start">製品から使い始める商材</text><rect x="727" y="214" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="247" fill="#fff" font-size="21" font-weight="700" text-anchor="start">営業が商談する商材</text><rect x="64" y="274" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="305.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">最適化の成果</text><rect x="306" y="274" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="293.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">trial_started か</text><text x="326" y="317.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">registration_completed</text><rect x="727" y="274" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="293.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">lead_created か</text><text x="747" y="317.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">appointment_scheduled</text><rect x="64" y="328" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="359.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">評価する成果</text><rect x="306" y="328" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="347.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">有料化の率と有料契約</text><text x="326" y="371.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（自社のデータで追う）</text><rect x="727" y="328" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="347.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">商談化・受注</text><text x="747" y="371.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（CRMで追う）</text><rect x="64" y="382" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="413.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">計測</text><rect x="306" y="382" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="401.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">登録はPixel、有料化は</text><text x="326" y="425.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Conversions APIで7日以内に</text><rect x="727" y="382" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="401.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">申込はPixel、商談化は</text><text x="747" y="425.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Conversions APIかCRMで集計</text><rect x="64" y="436" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="467.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">リンク先</text><rect x="306" y="436" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="455.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">用途別の説明ページと</text><text x="326" y="479.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">登録・トライアルのボタン</text><rect x="727" y="436" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="455.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">業種・課題別のページと</text><text x="747" y="479.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">資料請求・デモの申込</text><rect x="64" y="490" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="521.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">判定の時期</text><rect x="306" y="490" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="509.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">トライアルの期間の</text><text x="326" y="533.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">終わりを含める</text><rect x="727" y="490" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="747" y="509.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">商談の期間に</text><text x="747" y="533.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">合わせる</text><rect x="64" y="556" width="1072" height="92" rx="12" fill="#10131A"/><text x="96" y="600" fill="#fff" font-size="25" font-weight="700" text-anchor="start">Ads Managerの売上・ROASの列は、購入（order_created）だけから計算</text><text x="96" y="634" fill="#fff" font-size="21" font-weight="500" text-anchor="start">有料契約の金額はこの列に入らない。ROASは自社のCRMや分析の仕組みで計算する</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの開発者向け資料（Supported Events・Conversions API）とヘルプをもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>