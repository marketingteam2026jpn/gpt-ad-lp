<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">HubSpot連携に必要な最大3つの権限</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">組織の承認（Business／Enterpriseの場合）と、本人の認可は別</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">HubSpotの権限</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告アカウントの</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">接続・キャンペーン</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">作成ができる</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告アカウント権限</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Ads Managerの</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">アカウントを</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">管理できる</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="631.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">組織の承認</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Business／Enterprise</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ならグローバル管理者</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">が承認（初期はオフ）</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">→</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">できること</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">接続・作成・成果確認</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">コンタクト・顧客</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">の単位で見られる</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">9月24日の外部アクセス管理は、外部アプリのアクセスを組織が管理する仕組み。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">広告の配信を止めるものではない。「Restricted」なら組織の管理者に確認する。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">管理画面の成果とHubSpotのコンタクト数は一致する保証がない。判断ごとに使う数字を決める。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターとリリースノートをもとに当社作成。当社はこの連携を接続・操作していません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>