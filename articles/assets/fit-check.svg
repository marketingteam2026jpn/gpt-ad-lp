<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">まず「国とカテゴリ」で確認する</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">出稿条件を確認してから、会話の場面と計測へ</text><rect x="64" y="237" width="524" height="290" rx="20" fill="#FFF1EA"/><text x="96" y="287" fill="#9E3000" font-size="23" font-weight="700">日本向けでも、区分は一律ではない</text><text x="96" y="340" fill="#10131A" font-size="27" font-weight="700">許可：金融ソフトウェアなど</text><text x="96" y="386" fill="#10131A" font-size="26" font-weight="700">制限：預金口座・住宅ローンなど</text><text x="96" y="432" fill="#10131A" font-size="27" font-weight="700">不可：法務サービス・病院など</text><text x="96" y="478" fill="#10131A" font-size="25" font-weight="700">制限区分は承認済みの広告主のみ</text><text x="96" y="508" fill="#4E5766" font-size="19" font-weight="500">公式の国別表を確認（2026年9月25日）</text><rect x="612" y="237" width="524" height="290" rx="20" fill="#EEEFFE"/><text x="644" y="287" fill="#343BC0" font-size="25" font-weight="700">許可の中心になっている領域</text><text x="644" y="340" fill="#10131A" font-size="27" font-weight="700">・生活用品・家庭用品</text><text x="644" y="386" fill="#10131A" font-size="27" font-weight="700">・地域サービス</text><text x="644" y="432" fill="#10131A" font-size="27" font-weight="700">・旅行・体験</text><text x="644" y="478" fill="#10131A" font-size="27" font-weight="700">・デジタル製品・教育</text><text x="644" y="508" fill="#4E5766" font-size="19" font-weight="500">広告文・画像・遷移先のすべてが審査対象</text><rect x="64" y="550" width="1072" height="60" rx="12" fill="#10131A"/><text x="150" y="590" fill="#fff" font-size="25" font-weight="700">① 出せるか</text><text x="470" y="590" fill="#fff" font-size="25" font-weight="700">② 届けられるか</text><text x="850" y="590" fill="#fff" font-size="25" font-weight="700">③ 測れるか</text><text x="64" y="658" fill="#4E5766" font-size="25" font-weight="500">購入や問い合わせを測れなければ、獲得成果の良し悪しは判断できません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>