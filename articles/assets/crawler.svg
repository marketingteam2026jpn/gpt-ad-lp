<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">審査クローラーに読ませる5つの確認</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">必須はOAI-AdsBot。ブラウザで開けても、読めるとは限らない</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告のURL</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">パラメータ付きで</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">開き、転送の先に</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告の商品が出るか</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">robots.txt</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">転送先を含む</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">各ホストで</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">OAI-AdsBotを許可</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">セキュリティ</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">WAF・CDN・</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ボット対策・認証・</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">地域の制限</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">受け取るページ</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">403・404・429</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">や、空白・ログイン</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">の画面でないか</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">直した後</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">代表のURLで再確認。</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">状態が変わらねば</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">再提出・再審査</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">robots.txtを直しても、WAF・CDN・ボット対策で止まることがある</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">読めるようになっても審査の承認は保証されない。状態が変わらなければ再提出・再審査を</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンター（2026年10月29日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>