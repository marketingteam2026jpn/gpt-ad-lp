<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">公開事例の数字を読む前に確認する5つの視点</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">公式に業種横断のベンチマークはない。数字は条件つきの結果として読む</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">誰の報告か</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告主・運用会社</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">・媒体社の掲載か</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">第三者の検証は？</text><rect x="282" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="304.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">何と比べたか</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">他の媒体か</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">自社の過去か</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">比較なしか</text><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">期間と母数</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">期間・広告費</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示・クリック・</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果の件数</text><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">成果の定義</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">購入・登録・</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">問い合わせ・受注</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">のどれか</text><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">計測の方法</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ラストクリックか</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ビュースルーや</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">推計を含むか</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">比率だけの数字、別期間の数字、推計を含む数字は、そのまま並べない。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">判断には、既存媒体と定義・帰属・期間をそろえた自社の数字を使う。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">OpenAIの公式事例も、多くは広告主の社内データによる自己報告です。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターと公開事例をもとに当社作成。事例の読み方は当社の見解です。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>