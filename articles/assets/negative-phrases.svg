<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">出したくない会話を4つに分けて考える</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">除外フレーズは対象の広告主のみ。設定の手順は公開されていない</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">OpenAIの基準</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">センシティブな会話</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">や不適切な分野は、</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">外れる設計</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">設定で外す</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">地域の除外</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">プラットフォーム</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">オーディエンス除外</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告文・LP</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">誰向けかを冒頭で</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">示す。ヒントでは</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">除外できない</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="903.5" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">除外フレーズ</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ブランドの方針で</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">避けたい会話</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">対象の広告主のみ</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">1〜3で扱えないものだけを、除外フレーズの候補にする</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">語句・表記のゆれ・理由・見直す日を一覧にしておく（当社の提案）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの広告ポリシー・ヘルプ・2026年10月5日の発表をもとに当社作成。4つの分け方は当社の整理。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>