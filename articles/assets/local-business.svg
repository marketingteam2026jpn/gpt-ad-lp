<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">地域ビジネスの成果をどこまで測れるか</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">予約・問い合わせは標準イベントで。来店と成約は自社の記録で照合する</text><rect x="64" y="228" width="560" height="46" rx="10" fill="#10131A"/><text x="84" y="259.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">1. 表示・クリック</text><text x="648" y="258.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Ads Managerで約15分ごとに更新</text><rect x="64" y="282" width="482" height="46" rx="10" fill="#10131A"/><text x="84" y="313.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">2. LPに到達</text><text x="648" y="312.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">UTMで自社のアクセス解析と照合する</text><rect x="64" y="336" width="403" height="46" rx="10" fill="#FF5A1F"/><text x="84" y="367.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">3. 予約・問い合わせ</text><text x="648" y="366.0" fill="#9E3000" font-size="17" font-weight="700" text-anchor="start">標準イベント。成果最適化の目標にできる</text><rect x="64" y="390" width="325" height="46" rx="10" fill="#10131A"/><text x="84" y="421.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">4. 電話のタップ</text><text x="648" y="420.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">カスタムイベントで測れるが、目標にはできない</text><rect x="64" y="444" width="246" height="46" rx="10" fill="#10131A"/><text x="84" y="475.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">5. 来店・成約</text><text x="648" y="474.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告の成果として数える方法の説明はない</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">ヒントでは地域を絞れない。商圏はキャンペーンの地域設定で指定する。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">市区町村・郵便番号を選べるかは国により異なる。Ads Managerで地名を検索して確かめる。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">クリック後の帰属期間は最長30日。それより後の契約は広告の成果に入りません。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターと開発者向けドキュメント（2026年10月7日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>