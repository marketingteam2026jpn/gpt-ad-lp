<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">旅行・宿泊の広告で先に確かめる5つのこと</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">ホテルフィードは承認済みのパイロット広告主だけの限定ベータ</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">訴求</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">酒・賭博が主題の</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">体験は対象外</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">効能はうたわない</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">配信する国</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">国ごとに分ける</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">新規は自国のみの</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">場合がある</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告グループ</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">旅の目的・時期・</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">条件で分けて</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ヒントに書く</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="740.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">予約の計測</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予約完了に</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Pixelか</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Conversions API</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">帰属期間</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クリック最大30日</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ビューは0日か1日</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予約までの日数で</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">公式事例：記録された購入手続き・予約のイベントの54%がビュー経由に帰属</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">ホテルグループ1社の数字。期間・件数・帰属期間・広告費の記載はなく、目安にはしない</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">順番と当てはめは当社の提案です。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの広告ポリシー・公式ヘルプ・開発者向けドキュメント・公式事例をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>