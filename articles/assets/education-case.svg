<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">教育分野の公開事例2件は、条件がそろっていない</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">結果の差を「教育という業種」の向き不向きとして読まない</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">AI語学学習アプリP</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">ドイツの語学学校S</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">成果の定義</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">無料体験の開始・売上</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">講座の申込フォーム送信</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">期間</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">約2か月〜10週間（指標で違う）</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">1週間</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">比較相手</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">既存のネイティブ広告</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">同じ週の既存のGoogle検索広告</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">公表結果</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">体験開始単価 約51%低</text><text x="326" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ROAS 約26%高（別期間）</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">約€100で成果1件</text><text x="747" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Googleは€5.83／件</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">公表した主体</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">OpenAI公式（社内推計）</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">運用した広告支援会社</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">自社で試すなら：短い成果を先に置き、既存媒体と同じ定義・期間で比べる。</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">18歳未満と判定されたアカウントには表示されない。中高生向けは保護者の場面で。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">各社の公開情報をもとに当社作成。掲載事例は他社の公開情報で、当社の運用実績ではありません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>