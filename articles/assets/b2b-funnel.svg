<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">B2Bの成果は5段階。事例はどこまで示しているか</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">問い合わせ単価と受注単価は逆転し得る。同じ定義・十分な期間で比べる</text><rect x="64" y="228" width="560" height="46" rx="10" fill="#10131A"/><text x="84" y="259.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">1. 表示・クリック</text><text x="648" y="258.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">CPCが安い＝見込み客とは限らない（支援会社A）</text><rect x="64" y="282" width="482" height="46" rx="10" fill="#10131A"/><text x="84" y="313.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">2. サイト到達</text><text x="648" y="312.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クリックの70%超がセッションに（API企業Q）</text><rect x="64" y="336" width="403" height="46" rx="10" fill="#10131A"/><text x="84" y="367.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">3. 登録・リード</text><text x="648" y="366.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">登録単価が検索広告比 約30%低（SaaS AC）</text><rect x="64" y="390" width="325" height="46" rx="10" fill="#10131A"/><text x="84" y="421.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">4. 商談</text><text x="648" y="420.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">営業が有効・商談を判定（当社の提案）</text><rect x="64" y="444" width="246" height="46" rx="10" fill="#FF5A1F"/><text x="84" y="475.0" fill="#fff" font-size="21" font-weight="700" text-anchor="start">5. 受注・売上</text><text x="648" y="474.0" fill="#9E3000" font-size="17" font-weight="700" text-anchor="start">CPLは安いが顧客獲得単価はGoogleが低い（支援会社V）</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">広告の管理画面で見えるのは、基本的にリードまで。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">商談・受注はCRMに流入元（UTM・キャンペーンID）を残して集計する。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">各社の公開情報（自己報告）をもとに当社作成。掲載事例は他社の公開情報で、当社の運用実績ではありません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>