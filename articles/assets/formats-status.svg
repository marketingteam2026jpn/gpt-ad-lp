<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">主な機能の提供段階（2026年9月25日時点）</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">発表されたことと、自社のアカウントで今使えることは別</text><rect x="64" y="228" width="254" height="272" rx="20" fill="#F5F6F9"/><text x="86.0" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">提供中</text><text x="86.0" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">通常の広告</text><text x="86.0" y="382" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クリック課金の</text><text x="86.0" y="408" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果最適化</text><text x="86.0" y="434" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">HubSpot連携</text><rect x="336" y="228" width="254" height="272" rx="20" fill="#F5F6F9"/><text x="358.5" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">ベータ</text><text x="358.5" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">商品フィード広告</text><text x="358.5" y="356" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">表示課金の最適化</text><text x="358.5" y="410" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示課金は「提供を</text><text x="358.5" y="436" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">急速に拡大中」と明記</text><text x="358.5" y="462" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">※管理画面もベータ版</text><rect x="609" y="228" width="254" height="272" rx="20" fill="#F5F6F9"/><text x="631.0" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">順次展開</text><text x="631.0" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">AIの作成支援</text><text x="631.0" y="356" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">Shopifyアプリ</text><text x="631.0" y="410" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">9/16に順次提供と発表</text><text x="631.0" y="436" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Shopifyは9/23から</text><text x="631.0" y="462" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">展開予定と発表</text><rect x="882" y="228" width="254" height="272" rx="20" fill="#FFF1EA"/><text x="903.5" y="274" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">限定</text><text x="903.5" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">Sponsored</text><text x="903.5" y="356" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">Agents</text><text x="903.5" y="410" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">選ばれた広告主の</text><text x="903.5" y="436" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">限定アルファ</text><text x="903.5" y="462" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">申し込み受付なし</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">8/31の発表時点で40か国超。9/23の東南アジア・台湾7市場の追加で60か国超と発表。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">「一部」「テスト」「ベータ」「順次」を読み落とさず、管理画面で確かめる。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの公式発表とヘルプセンターをもとに当社作成。提供段階の分け方は当社の整理です。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>