<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">常設のフィードと、期間限定のCPC</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">公開事例は、役割の違う2本を同時に走らせている</text><rect x="64" y="237" width="524" height="300" rx="20" fill="#EEEFFE"/><text x="96" y="290" fill="#343BC0" font-size="25" font-weight="700">常設：商品フィード配信</text><text x="96" y="348" fill="#10131A" font-size="30" font-weight="700">在庫から自動で当てる</text><text x="96" y="402" fill="#4E5766" font-size="20" font-weight="500">・タイトル・価格・在庫・画像を更新</text><text x="96" y="442" fill="#4E5766" font-size="20" font-weight="500">・個別広告を量産しなくて済む</text><text x="96" y="482" fill="#4E5766" font-size="20" font-weight="500">・新規は地域指定が国単位のみ</text><rect x="612" y="237" width="524" height="300" rx="20" fill="#FFF1EA"/><text x="644" y="290" fill="#9E3000" font-size="25" font-weight="700">期間限定：セール時のCPC</text><text x="644" y="348" fill="#10131A" font-size="30" font-weight="700">値引きと期間を訴求</text><text x="644" y="402" fill="#4E5766" font-size="20" font-weight="500">・セールに合わせて都度つくる</text><text x="644" y="442" fill="#4E5766" font-size="20" font-weight="500">・予算週は日曜から土曜</text><text x="644" y="482" fill="#4E5766" font-size="20" font-weight="500">・週をまたぐ日程が事故になる</text><rect x="64" y="560" width="1072" height="96" rx="20" fill="#F5F6F9"/><text x="96" y="602" fill="#10131A" font-size="24" font-weight="700">公表値：28日間の全体ROAS 3倍／2週間のセール施策 ROAS 7倍</text><text x="96" y="636" fill="#4E5766" font-size="20" font-weight="500">広告費・購入件数・帰属期間は非開示。自社の目標値には使えません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月19日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>