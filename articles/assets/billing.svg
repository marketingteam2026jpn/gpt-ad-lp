<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">ChatGPT広告の請求の流れ（カード払い）</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">後払い。使う額は予算で決まり、請求のタイミングはしきい値で決まる</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">請求の設定</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">事業者名・住所・</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">送付先メールと</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">カードを登録</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">配信</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示・クリックに</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">応じて未払いの</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告費がたまる</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="522.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">しきい値で請求</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">未払いが</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">しきい値に達すると</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">カードへ請求</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">月末に請求</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">しきい値未満でも</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">月末に残りの</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">未払い分を請求</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">しきい値の上昇</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">支払いの実績など</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">に応じて自動で</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">上がることがある</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">同じ金額の請求が続いても重複とは限らない。それぞれが追加の広告費。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">支払いが成功するたびに領収書のメール。しきい値は予算でも上限でもない。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">請求書払い（営業担当が管理する一部の広告主）は、個別の請求条件に従います。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンター（Billing &amp; Payment ほか）をもとに当社作成。税務の扱いは税理士に確認してください。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>