<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">ChatGPT広告の構成と、各階層で決めること</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">アカウントの下に、キャンペーン→広告グループ→広告の3階層</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">0</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">アカウント</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ブランド名・ロゴ</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">国・通貨・タイムゾーン</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">請求・データソース</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="358.5" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">キャンペーン</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">目的・成果イベント</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算（総額か日予算）</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">期間・地域・対象者</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告グループ</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">テーマ・相談場面</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">コンテキストヒント</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">入札の方法と上限</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">見出し・説明文</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">画像1枚か4〜6枚</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">リンク先URL</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">予算・目的・地域を分けるならキャンペーン、メッセージ・LP・入札なら広告グループ</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">目的・課金方式・成果イベントと、国・通貨・タイムゾーンは作成後に変えられない</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">分け方の目安は当社の見解です。日予算の最低額はキャンペーンごとです（日本円は2,500円）。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターと開発者向けドキュメント（Campaign Management、Bidding &amp; Budgets）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>