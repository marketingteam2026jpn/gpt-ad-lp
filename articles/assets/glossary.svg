y="347.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">予算週の1日の平均。1日は</text><text x="747" y="371.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">最大2倍、7日で最大7倍</text><rect x="64" y="382" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="413.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">支払いしきい値</text><rect x="306" y="382" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="413.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">消化の上限・予算</text><rect x="727" y="382" width="409" height="48" rx="10" fill="#FFF1EA"/><text x="747" y="401.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">カードに請求する時点の額。</text><text x="747" y="425.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算でも上限でもない</text><rect x="64" y="436" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="467.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">帰属期間</text><rect x="306" y="436" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="467.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">変えると最適化も変わる</text><rect x="727" y="436" width="409" height="48" rx="10" fill="#FFF1EA"/><text x="747" y="455.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">レポートだけの設定。最適化・</text><text x="747" y="479.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">入札・課金は変わらない</text><rect x="64" y="490" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="521.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">コンテキストヒント</text><rect x="306" y="490" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="521.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">一致した会話に出すキーワード</text><rect x="727" y="490" width="409" height="48" rx="10" fill="#FFF1EA"/><text x="747" y="509.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">関連性の手がかり。完全一致</text><text x="747" y="533.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ではなく、配信を保証しない</text><rect x="64" y="556" width="1072" height="92" rx="12" fill="#10131A"/><text x="96" y="600" fill="#fff" font-size="25" font-weight="700" text-anchor="start">用語の意味は、課金・予算・レポートのどこに効くかで確かめる</text><text x="96" y="634" fill="#fff" font-size="21" font-weight="500" text-anchor="start">社内の報告では、成果の定義・帰属期間・提供段階を添える（当社の提案）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプ（Conversion-optimized Campaigns・Daily Budgets・Billing・Measure Results ほか）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>