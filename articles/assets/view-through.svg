<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">クリック経由とビュー経由の違い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">どちらも同じPixel・Conversions APIのイベントから数える</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">クリック経由</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">ビュー経由</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">数える条件</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">広告をクリックした後の成果</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="302.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">表示から1日以内で、</text><text x="747" y="326.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">同じ成果にクリックがない</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">帰属期間</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">7日・14日・30日から選ぶ</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">0日（無効）か1日</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">成果の合計</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">常に入る</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">ビューを1日にすると入る</text><text x="747" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（0日なら入らない）</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">GA4のUTM別</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="470.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">UTMを付けていれば広告の流入</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">UTMが付かず、</text><text x="747" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">別の流入元に分かれる</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">成果最適化</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">クリック課金・表示課金とも対象</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">表示課金で対象（ヘルプの説明）</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">帰属期間の設定はレポートだけに効く。最適化・入札・課金は変わらない</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">比べるときは、帰属期間・日付の基準・期間とタイムゾーンをそろえる</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">公式ヘルプ（Measure Results、Conversion-optimized Campaigns）をもとに当社作成。GA4の行は当社の解釈。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>