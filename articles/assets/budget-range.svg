<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">日予算2,500円で、実際に動く金額</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">1日・7日の上限と、公開されているクリック単価の幅</text><rect x="64" y="237" width="341" height="196" rx="20" fill="#FFF1EA"/><text x="96" y="288" fill="#9E3000" font-size="24" font-weight="700">設定する日予算</text><text x="96" y="356" fill="#10131A" font-size="58" font-weight="700">2,500</text><text x="266" y="356" fill="#10131A" font-size="28" font-weight="500">円</text><text x="96" y="400" fill="#4E5766" font-size="20" font-weight="500">最低額。7日間の平均として扱う</text><rect x="429" y="237" width="341" height="196" rx="20" fill="#F5F6F9"/><text x="461" y="288" fill="#6B7482" font-size="24" font-weight="700">1日の消化上限</text><text x="461" y="356" fill="#10131A" font-size="58" font-weight="700">5,000</text><text x="631" y="356" fill="#10131A" font-size="28" font-weight="500">円</text><text x="461" y="400" fill="#4E5766" font-size="20" font-weight="500">日予算の2倍まで振れる</text><rect x="794" y="237" width="341" height="196" rx="20" fill="#F5F6F9"/><text x="826" y="288" fill="#6B7482" font-size="24" font-weight="700">7日間の消化上限</text><text x="826" y="356" fill="#10131A" font-size="58" font-weight="700">17,500</text><text x="1030" y="356" fill="#10131A" font-size="28" font-weight="500">円</text><text x="826" y="400" fill="#4E5766" font-size="20" font-weight="500">日予算の7倍。予算週は日〜土</text><rect x="64" y="457" width="1072" height="162" rx="20" fill="#F5F6F9"/><text x="96" y="504" fill="#10131A" font-size="24" font-weight="700">公開されている国内の平均CPC（2社の公表値の幅）</text><text x="96" y="556" fill="#10131A" font-size="21" font-weight="500">広告支援会社C</text><rect x="312" y="534" width="62" height="28" rx="5" fill="#5B62F0"/><text x="390" y="558" fill="#343BC0" font-size="30" font-weight="700">79円</text><text x="96" y="602" fill="#10131A" font-size="21" font-weight="500">広告支援会社D</text><rect x="312" y="580" width="340" height="28" rx="5" fill="#5B62F0"/><text x="668" y="604" fill="#343BC0" font-size="30" font-weight="700">435円</text><text x="800" y="556" fill="#4E5766" font-size="19" font-weight="500">5倍以上の開きがある</text><text x="800" y="584" fill="#4E5766" font-size="19" font-weight="500">業種別の相場ではない</text><text x="800" y="612" fill="#4E5766" font-size="19" font-weight="500">見積もりは上側で置く</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500">日予算は1日の停止額ではありません。決めるのは検証の総額と、いつ判定するかです。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500">CPCは各社が公表した条件での実測値です。図の示唆は株式会社Ikigaiの見解です。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月19日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>