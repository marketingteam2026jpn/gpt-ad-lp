<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">成果が出ないときに確認する順番</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">上から順に。原因が確定するまで広告やLPを変えない</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">計測</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">イベント名が</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">キャンペーンの</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">設定と一致するか</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">サイト到達</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クリックと</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">セッションの差</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">UTM・参照値</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">LPの導線</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告の約束が</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">1画面目にあるか</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">フォームの負担</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">母数</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クリック×CVR</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">で期待値を計算</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">足りなければ保留</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">相談場面</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ヒント・広告文・</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">LPを同じ場面に</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">合わせて変える</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">イベントが届いていても、設定と一致しなければ0のまま。直しても遡らない。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">「0件」と言えるのは、計測と到達が正常で、母数も十分なときだけ。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">例：CVR2%なら、40クリックで期待できる成果は0.8件。0件でも偶然の範囲です。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターと公開事例をもとに当社作成。確認の順序は当社の見解です。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>