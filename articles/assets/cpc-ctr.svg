<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">CPC・CTRが事例ごとに違う5つの理由</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">公開値は条件つきの結果。平均せず、条件をそろえて読む</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">市場・国</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">同じ設計でも国で</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">CPCが4倍以上</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">違った例がある</text><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">入札の上限</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">上限が高い初日に</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">単価が高く出て</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算が早く減った</text><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">課金方式</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示課金では</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">CTRが低いほど</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">CPCが高くなる</text><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告・画像</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">画像だけ違う3本で</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">CTRが0.75〜</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">3.39%に分かれた</text><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">期間と量</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">初日・初週と</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">1か月で値が違う</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">数十クリックは参考</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">他社の値は相場ではない。自社の検索・SNSと同じ定義・期間で比べる。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">見積もりは公開値の高い側で置き、最初の1〜2週間の実績で置き換える。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">各社の公開情報（主に2026年6〜9月の配信）とOpenAIのヘルプをもとに当社作成。掲載事例は当社の運用実績ではありません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>