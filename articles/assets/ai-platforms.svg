<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">AIの回答画面の広告、4社の現状</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">日本の広告主から見た2026年10月29日時点の状況</text><rect x="64" y="222" width="254" height="326" rx="20" fill="#F5F6F9"/><text x="86.0" y="268" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">OpenAI</text><text x="86.0" y="322" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">ChatGPT</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">の回答</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">日本で出稿・表示できる</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">専用の管理画面で</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算と成果を分けて</text><text x="86.0" y="482" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">管理・計測できる</text><text x="86.0" y="508" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告は回答と別の枠</text><text x="86.0" y="534" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示はFree・Goのみ</text><rect x="336" y="222" width="254" height="326" rx="20" fill="#F5F6F9"/><text x="358.5" y="268" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">Google</text><text x="358.5" y="322" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">AI Overviews</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">・AI Mode</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">日本は概要の上下に</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">通常の広告が出る</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">回答の中の広告は</text><text x="358.5" y="482" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">英語の12か国のみ</text><text x="358.5" y="508" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">日本は国の一覧にない</text><text x="358.5" y="534" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">AIの面だけ外せない</text><rect x="609" y="222" width="254" height="326" rx="20" fill="#F5F6F9"/><text x="631.0" y="268" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">Microsoft</text><text x="631.0" y="322" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">Copilot</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">の回答</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">既存の広告が自動で</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">対象。参加は止められない</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">日本語は2025年3月に</text><text x="631.0" y="482" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">「今月」と発表</text><text x="631.0" y="508" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">その後は公式に未確認</text><text x="631.0" y="534" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Copilot別の指標なし</text><rect x="882" y="222" width="254" height="326" rx="20" fill="#F5F6F9"/><text x="903.5" y="268" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">Perplexity</text><text x="903.5" y="322" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">Perplexity</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">の回答</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">2024年11月に米国で</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告の実験開始を発表</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">10月29日時点で</text><text x="903.5" y="482" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告主向けの案内が</text><text x="903.5" y="508" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">見当たらない</text><text x="903.5" y="534" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">終了の公式発表は未確認</text><rect x="64" y="560" width="1072" height="90" rx="12" fill="#10131A"/><text x="96" y="604" fill="#fff" font-size="25" font-weight="700" text-anchor="start">比べる軸は、日本で使えるか・回答との関係・枠を分けて測れるか</text><text x="96" y="638" fill="#fff" font-size="21" font-weight="500" text-anchor="start">成果の優劣は比べられない。各社の発表は自社データで、条件がそろっていない（当社の見解）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">出典：OpenAI・Google・Microsoft・Perplexityの公式ヘルプと発表（2026年10月29日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>