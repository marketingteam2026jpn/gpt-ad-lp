<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">美容・健康・医療の日本向けの扱い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">国別表の「米国以外」の列で「可」は、ヘルスケア向けソフトウェアだけ</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">国別表で米国以外は「不可」</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">原文で認められ得る／表にない</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">医療機関</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">病院・救急、遠隔医療、検査・診断</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">ヘルスケア向けソフトウェア（可）</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">美容</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">低侵襲の美容施術</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="354.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">化粧品・サロン（表にない）</text><text x="747" y="378.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">医療的な主張をしない</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">食品</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">サプリメント</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">一般の栄養食品（本文）</text><text x="747" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">大手小売のサプリは本文と表で差</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">機器・アプリ</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">消費者向けの医療機器・</text><text x="326" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ウェアラブル・アプリ</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">フィットネス機器・運動</text><text x="747" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">プログラム（本文）</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">女性の健康</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">生理・妊娠・出産・</text><text x="326" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">産後の商品</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">本文は生理用品を一般の</text><text x="747" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">健康商品の例に挙げる</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">本文と表で読み方が分かれる商材は、どちらか一方だけで判断しない。</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">出せる業種でも、個人の健康やメンタルヘルスの会話には広告は表示されない。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">広告ポリシーv1.6と規制領域の国別表（2026年10月7日確認）をもとに当社作成。審査結果を保証しません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>