<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">よくある失敗の4つの分野</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">12の失敗を、起きること→原因→防ぎ方で引けるように分けた</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">計測</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">届いているか</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">読み込み≠送信</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">イベント名の不一致</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">二重計上・テスト</text><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">審査</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">確認と課金</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">確認の前に配信も</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">止めたいなら停止</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クローラーを許可</text><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">予算</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">上限と止め方</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">日予算は週の平均</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">国は除外だけでは不足</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">停止は最大24時間</text><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">設定</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">戻せない・古い</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">目的・成果は固定</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ヒントは指示でない</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">LPの情報を最新に</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">確かめたことにならないものを、確かめたことにしない</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">読み込み・受け付け・審査の通過は、送信・帰属・配信の確認とは別（ヘルプ）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプ（Troubleshooting conversion tracking・Onboarding and Policy Issues ほか）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>