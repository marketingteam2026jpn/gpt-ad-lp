<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">一括編集で重複と上書きを防ぐ5つの手順</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">処理が完了しても、すべての行が成功したとは限らない</text><rect x="64" y="228" width="200" height="272" rx="20" fill="#F5F6F9"/><text x="86.0" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">最新を書き出す</text><text x="86.0" y="382" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Export for edit</text><text x="86.0" y="408" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">で今のIDと値を</text><text x="86.0" y="434" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">編集の前に取り直す</text><path d="M267 364 L279 364" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="228" width="200" height="272" rx="20" fill="#F5F6F9"/><text x="304.0" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">編集する</text><text x="304.0" y="382" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">既存行はIDを残す</text><text x="304.0" y="408" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">新規行はID空欄で</text><text x="304.0" y="434" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">親IDを入れる</text><text x="304.0" y="460" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ヒントは全件書く</text><path d="M485 364 L497 364" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="228" width="200" height="272" rx="20" fill="#F5F6F9"/><text x="522.0" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">アップロード</text><text x="522.0" y="382" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">タブ名・列名は</text><text x="522.0" y="408" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">変えない</text><text x="522.0" y="434" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">大量なら小分けも</text><path d="M703 364 L715 364" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="228" width="200" height="272" rx="20" fill="#FFF1EA"/><text x="740.0" y="274" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">結果を照合</text><text x="740.0" y="382" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">行ごとの成否と</text><text x="740.0" y="408" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">作成済みの広告を</text><text x="740.0" y="434" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">突き合わせる</text><path d="M921 364 L933 364" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="228" width="200" height="272" rx="20" fill="#F5F6F9"/><text x="958.0" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">必要な行だけ</text><text x="958.0" y="382" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成功した行は</text><text x="958.0" y="408" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">送り直さない</text><text x="958.0" y="434" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（重複の原因）</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">成功済みの行をad_id空欄のまま送り直すと、同じ広告がもう1本できる。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">目的と予算の種類は編集で変えない。違っていれば新しいキャンペーンで。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">APIは停止状態で作成→確認→有効化。通信が途切れたら、重複を防ぐキーを変えずに送り直す。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターと開発者向けドキュメントをもとに当社作成。当社はAPIの動作を確認していません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>