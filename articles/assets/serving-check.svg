<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">配信されないときに見る順番</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">上から順に確認し、原因が確定するまで設定を変更しない</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="86" y="296" fill="#6B7482" font-size="30" font-weight="700">0</text><text x="86" y="350" fill="#10131A" font-size="21" font-weight="700">表示は出ているか</text><text x="86" y="404" fill="#4E5766" font-size="17" font-weight="500">消化額0は未課金を</text><text x="86" y="430" fill="#4E5766" font-size="17" font-weight="500">意味しない</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304" y="296" fill="#6B7482" font-size="30" font-weight="700">1</text><text x="304" y="350" fill="#10131A" font-size="21" font-weight="700">本人確認・請求</text><text x="304" y="404" fill="#4E5766" font-size="17" font-weight="500">未完了だと配信</text><text x="304" y="430" fill="#4E5766" font-size="17" font-weight="500">されない</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522" y="296" fill="#6B7482" font-size="30" font-weight="700">2</text><text x="522" y="350" fill="#10131A" font-size="21" font-weight="700">広告の審査</text><text x="522" y="404" fill="#4E5766" font-size="17" font-weight="500">遷移先ページも</text><text x="522" y="430" fill="#4E5766" font-size="17" font-weight="500">審査の対象</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="740" y="296" fill="#9E3000" font-size="30" font-weight="700">3</text><text x="740" y="350" fill="#10131A" font-size="21" font-weight="700">今週の予算枠</text><text x="740" y="404" fill="#4E5766" font-size="17" font-weight="500">使い切ると有効の</text><text x="740" y="430" fill="#4E5766" font-size="17" font-weight="500">まま停止する</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958" y="296" fill="#6B7482" font-size="30" font-weight="700">4</text><text x="958" y="350" fill="#10131A" font-size="21" font-weight="700">入札と対象条件</text><text x="958" y="404" fill="#4E5766" font-size="17" font-weight="500">狭すぎ・低すぎを</text><text x="958" y="430" fill="#4E5766" font-size="17" font-weight="500">確認する</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700">予算週は日曜から土曜。枠を早く使い切ると、有効の表示のまま止まり得る。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500">木曜に止まって金曜も動かない。なら日曜を待つ。触ると切り分けができなくなる。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500">コンバージョンだけ0のときは別の原因です。イベント名の不一致を先に疑います。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500">この手順で必ず特定できるとは限りません。切り分けられない場合はサポートへ問い合わせます。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月19日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>