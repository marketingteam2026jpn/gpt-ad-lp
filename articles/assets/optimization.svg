<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">成果最適化の課金は2種類</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">同じ「コンバージョンを目指す配信」でも、費用が発生する単位は異なる</text><rect x="64" y="237" width="524" height="290" rx="20" fill="#FFF1EA"/><text x="96" y="307" fill="#10131A" font-size="52" font-weight="700">oCPC</text><text x="96" y="349" fill="#9E3000" font-size="22" font-weight="700">クリック課金</text><text x="96" y="428" fill="#10131A" font-size="37" font-weight="700">有効なクリック</text><text x="96" y="480" fill="#4E5766" font-size="25" font-weight="500">クリックごとに課金</text><rect x="612" y="237" width="524" height="290" rx="20" fill="#EEEFFE"/><text x="644" y="307" fill="#10131A" font-size="52" font-weight="700">oCPM</text><text x="644" y="349" fill="#343BC0" font-size="22" font-weight="700">表示課金</text><text x="644" y="428" fill="#10131A" font-size="37" font-weight="700">1,000回の表示</text><text x="644" y="480" fill="#4E5766" font-size="25" font-weight="500">表示回数に応じて課金</text><rect x="64" y="550" width="1072" height="60" rx="12" fill="#10131A"/><text x="260" y="590" fill="#fff" font-size="25" font-weight="700">どちらも、成果が出た件数だけ支払う方式ではありません。</text><text x="64" y="658" fill="#4E5766" font-size="25" font-weight="500">事前に必要：成果計測の設定 → 対応する標準イベント → 新規キャンペーンの作成</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月19日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>