<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">開設から配信までの5つの段階</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">確認は別々に進む。1つが終わっても、ほかが終わったとは限らない</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">アカウント</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">国・通貨・時間帯</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">は作成後に</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">変えられない</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">請求の設定</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">プロファイルと</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">カード。仮押さえ</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">は課金とは別</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="522.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">事業者の確認</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">確認中は最大</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">7営業日。消化の</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">後に追加の確認も</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告の審査</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">否認の理由は</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">状態の表示で</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">確かめる</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">配信</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">承認・請求・状態</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算・日程が</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">そろえば始まり得る</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">一部のアカウントは、追加の事業者確認の前に配信・課金が始まり得る</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">止めたいときは自分で一時停止する。確認が終わっていないことを止める手段にしない</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプ（Troubleshooting Common Onboarding and Policy Issues ほか）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>