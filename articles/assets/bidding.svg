<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">「成果を最大化」と手動の上限入札の違い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">入札は広告グループ単位。実際に払う額はオークションで決まる</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">成果を最大化（自動）</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">手動の上限入札・Bid Cap</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">入札額</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">OpenAIが予算内で自動で調整</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="302.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">上限を自分で決める（CPC・</text><text x="747" y="326.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">CPM、成果最適化はBid Cap）</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">予算の種類</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">日予算だけ</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">日予算・総額予算</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">入札調整</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">使えない</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">オーディエンスごとに</text><text x="747" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">0.1〜10倍で調整できる</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">単価の管理</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">件数を優先。単価の</text><text x="326" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">目標は保証されない</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">上限を決められるが、低すぎると</text><text x="747" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">配信が絞られる（CPAの保証はない）</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">向く場面</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">入札の材料がなく、まず</text><text x="326" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">配信と件数を確かめたい</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">単価の上限を決めている・</text><text x="747" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">総額予算で管理したい</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">ヘルプが示す推奨の初期値は、目的がクリックの上限CPCの3〜5米ドルだけ</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">Bid Capは「現時点で推奨額なし」。上限CPM・円建ての推奨値は示されていない</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">公式ヘルプと開発者向けドキュメント（Bidding &amp; Budgets）をもとに当社作成。予算の種類と入札調整の行は開発者向けの記載。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>