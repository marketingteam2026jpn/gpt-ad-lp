<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">金融・保険・ローンの日本向けの扱い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">国別表の「米国以外」の列で「可」は、金融ソフトウェアだけ</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">可</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">1区分</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">金融ソフトウェア</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（本文：金融商品を</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">勧めない道具・教育）</text><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">承認済みのみ</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">6区分</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">預金・カード・保険・</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">自動車ローン・</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">住宅ローン・投資</text><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">不可</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">11区分</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">個人向けローン・後払い・</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">決済・暗号資産・</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">債務の軽減・整理など</text><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">本文</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">米国外は原則禁止</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ポリシー本文は、</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">米国外の金融サービス</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">の広告を原則禁止</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">「承認済みの広告主のみ」は、申し込めば出せるという意味ではない。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">少数の広告主とだけ取り組み、一部の区分は承認の申請を受け付けていない（国別表の注記）。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">医療保険は健康の表にあり、米国以外は「不可」です。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの広告ポリシーv1.6と規制領域の国別表（2026年10月29日確認）をもとに当社作成。審査結果を保証しません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>