<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">絞れるもの、絞れないもの</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">2026年9月時点で指定できる条件と、その制約</text><rect x="64" y="237" width="524" height="340" rx="20" fill="#EEEFFE"/><text x="96" y="287" fill="#343BC0" font-size="25" font-weight="700">絞れるもの</text><text x="96" y="340" fill="#10131A" font-size="23" font-weight="700">地域</text><text x="96" y="368" fill="#4E5766" font-size="19" font-weight="500">国＋州・市・マーケット・郵便番号</text><text x="96" y="402" fill="#10131A" font-size="23" font-weight="700">プラットフォーム</text><text x="96" y="430" fill="#4E5766" font-size="19" font-weight="500">Android/iOSのアプリ・Web、PC の5種</text><text x="96" y="464" fill="#10131A" font-size="23" font-weight="700">カスタムオーディエンス</text><text x="96" y="492" fill="#4E5766" font-size="19" font-weight="500">包含は25,000人の一致ユーザーから</text><text x="96" y="526" fill="#10131A" font-size="23" font-weight="700">除外</text><text x="96" y="554" fill="#4E5766" font-size="19" font-weight="500">より小さいリストでも使える</text><rect x="612" y="237" width="524" height="340" rx="20" fill="#FFF1EA"/><text x="644" y="287" fill="#9E3000" font-size="25" font-weight="700">絞れない・制約があるもの</text><text x="644" y="340" fill="#10131A" font-size="23" font-weight="700">会話そのもの</text><text x="644" y="368" fill="#4E5766" font-size="19" font-weight="500">ヒントは完全一致でも配信保証でもない</text><text x="644" y="402" fill="#10131A" font-size="23" font-weight="700">商品フィード</text><text x="644" y="430" fill="#4E5766" font-size="19" font-weight="500">新規キャンペーンは国単位の指定のみ</text><text x="644" y="464" fill="#10131A" font-size="23" font-weight="700">新規アカウント</text><text x="644" y="492" fill="#4E5766" font-size="19" font-weight="500">当初ホーム国のみ。他国を選んでも無効</text><text x="644" y="526" fill="#10131A" font-size="23" font-weight="700">年齢・性別・興味関心</text><text x="644" y="554" fill="#4E5766" font-size="19" font-weight="500">設定項目として案内されていない</text><rect x="64" y="600" width="1072" height="56" rx="12" fill="#F5F6F9"/><text x="96" y="636" fill="#10131A" font-size="23" font-weight="500">商圏の市区町村・郵便番号が選べるかは、Ads Managerの画面で候補を検索して確かめます。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月19日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>