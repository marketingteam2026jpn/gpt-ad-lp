<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">Shopifyで始める前に確認する5つのこと</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">公式アプリがあっても、準備の中心は商品データと計測</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告アカウント</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">請求を受ける法人</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">の国・通貨・TZは</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">後から変えられない</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">審査の対象</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">商品フィードも</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">同じポリシー</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">対象外の商品を除く</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="522.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">商品データ</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">名称・画像・価格</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">在庫・返品条件</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">画像URLが読めるか</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">成果の計測</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">売上とROASは</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">購入イベントのみ</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">二重計測に注意</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">データの扱い</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">顧客データの権限</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">プライバシー</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ポリシーと承認</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">商品フィード広告の配信地域は国単位のみ。登録した商品は広告にだけ使われる。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">日本のストアで完了するかは公開情報から確認できない。少ない商品・予算で同期と計測を確かめる。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">アプリは無料・英語表示（2026年9月25日時点の掲載）。広告費は別にかかります。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの発表・ヘルプセンター、Shopify App Storeの掲載をもとに当社作成。当社はこのアプリを接続・操作していません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>