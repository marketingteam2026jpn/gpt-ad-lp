<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">ChatGPT広告のレポートで読み違えやすい点</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">数字を報告する前に、設定と反映の時間を確かめる</text><rect x="306" y="214" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="247" fill="#fff" font-size="21" font-weight="700" text-anchor="start">読み違えやすい見方</text><rect x="727" y="214" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="747" y="247" fill="#fff" font-size="21" font-weight="700" text-anchor="start">公式資料の記載</text><rect x="64" y="274" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="305.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">直近の数字</text><rect x="306" y="274" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="305.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">その日の確定値と思う</text><rect x="727" y="274" width="409" height="48" rx="10" fill="#FFF1EA"/><text x="747" y="293.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">消化額は約7〜8時間遅れ、</text><text x="747" y="317.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果は24〜48時間ほど</text><rect x="64" y="328" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="359.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">成果の合計</text><rect x="306" y="328" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="359.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">帰属期間の設定を見ずに比べる</text><rect x="727" y="328" width="409" height="48" rx="10" fill="#FFF1EA"/><text x="747" y="347.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">ヘルプでは、ビューを1日にすると</text><text x="747" y="371.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示後1日以内の成果も入る※</text><rect x="64" y="382" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="413.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">成果の日付</text><rect x="306" y="382" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="413.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">成果が起きた日と思う</text><rect x="727" y="382" width="409" height="48" rx="10" fill="#FFF1EA"/><text x="747" y="401.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">既定は広告に接触した日。</text><text x="747" y="425.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果の日は別の列で見る</text><rect x="64" y="436" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="467.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">売上・ROAS</text><rect x="306" y="436" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="467.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">すべてのイベントの価値</text><rect x="727" y="436" width="409" height="48" rx="10" fill="#FFF1EA"/><text x="747" y="455.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">購入（order_created）の</text><text x="747" y="479.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">イベントだけから計算</text><rect x="64" y="490" width="230" height="48" rx="10" fill="#F5F6F9"/><text x="82" y="521.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">プラットフォーム</text><rect x="306" y="490" width="409" height="48" rx="10" fill="#F5F6F9"/><text x="326" y="521.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Desktop web＝パソコン全体</text><rect x="727" y="490" width="409" height="48" rx="10" fill="#FFF1EA"/><text x="747" y="509.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">APIではWindows・macOSの</text><text x="747" y="533.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">アプリは unknown に入る</text><rect x="64" y="548" width="1072" height="86" rx="12" fill="#10131A"/><text x="96" y="592" fill="#fff" font-size="25" font-weight="700" text-anchor="start">期間・タイムゾーン・帰属期間・日付の基準・成果の列を記録してから比べる</text><text x="96" y="626" fill="#fff" font-size="21" font-weight="500" text-anchor="start">週次は日曜〜土曜の完了した週で、成果の反映を待ってから報告する（当社の提案）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">※開発者向けのPixel・CAPIのページは「合計に含めない」と記載し、ヘルプと分かれています。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターと開発者向けドキュメント（2026年10月29日確認）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>