<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">ChatGPT広告とLLMO・GEOの違い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">公式に、広告は回答に影響しない。広告費で回答の中の露出は買えない</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">ChatGPT広告</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">LLMO・GEO（回答の中の言及）</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">表示される場所</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">回答の下のスポンサー枠</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">回答の本文・引用リンク</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">管理できること</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="354.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">相談場面・広告文・LP・予算</text><text x="326" y="378.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">開始と停止</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="354.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">情報発信とサイトの整備</text><text x="747" y="378.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">回答そのものは管理できない</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">届く相手</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">Free・Goの利用者</text><text x="326" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Plus・Pro・Business等と18歳未満は対象外</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">プランに関係なく回答を見る人</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">費用</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="470.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">広告費（表示またはクリック）</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="470.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">制作・改善の工数</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">測り方</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">広告専用のUTM・参照値で識別</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">広告専用のUTMが付かない流入</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">報告では混ぜない：自然流入の数字を広告の成果として書かない。</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">クローラーの許可は共通。OAI-AdsBotを止めると広告の審査が通らない。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">ChatGPT広告の列はOpenAIの公式情報、LLMO・GEOの列は一般的な説明をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>