<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">テストの判断は3段階に分ける</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">段階ごとに判定日と条件を開始前に決めておく（日数は目安）</text><rect x="64" y="228" width="254" height="272" rx="20" fill="#F5F6F9"/><text x="86.0" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">配信</text><text x="86.0" y="356" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">（〜7日）</text><text x="86.0" y="410" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示・消化ペース</text><text x="86.0" y="436" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算週は日〜土</text><text x="86.0" y="462" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">24時間は待つ</text><path d="M322 364 L334 364" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="228" width="254" height="272" rx="20" fill="#F5F6F9"/><text x="358.5" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">クリック後</text><text x="358.5" y="356" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">（〜14日）</text><text x="358.5" y="410" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">サイトに届いたか</text><text x="358.5" y="436" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">LPで予定した</text><text x="358.5" y="462" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">行動が起きたか</text><path d="M594 364 L606 364" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="228" width="254" height="272" rx="20" fill="#F5F6F9"/><text x="631.0" y="274" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">事業成果</text><text x="631.0" y="356" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">（30日〜）</text><text x="631.0" y="410" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">件数と単価</text><text x="631.0" y="436" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">できれば商談・</text><text x="631.0" y="462" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">受注・売上まで</text><path d="M866 364 L878 364" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="228" width="254" height="272" rx="20" fill="#FFF1EA"/><text x="903.5" y="274" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">→</text><text x="903.5" y="328" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">判断</text><text x="903.5" y="382" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">続ける・直す</text><text x="903.5" y="408" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">止める・保留</text><text x="903.5" y="434" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（母数不足は保留）</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">問い合わせ単価だけで判断しない。受注までの距離で判定日を決める。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">0件と未計測は別物。計測が動いていなければ段階3は判断できない。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">変更は1回に1つ。変更ログと週1回のレビューを残す。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">公式ヘルプの仕様と公開事例をもとに当社作成。判定日・基準は当社の提案で、成果を保証するものではありません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>