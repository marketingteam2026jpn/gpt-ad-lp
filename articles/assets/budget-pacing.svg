<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">日予算と総額予算のペーシングの違い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">どちらも、毎日同じ額や予算の全額を使うことは保証されない</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">日予算</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">総額予算（キャンペーン総額）</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">配分の考え方</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="302.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">予算週（日曜〜土曜）の</text><text x="326" y="326.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">1日あたりの平均</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="302.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">残りの予算と期間から</text><text x="747" y="326.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">配分を決める</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">消化の上限</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="354.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">1日は日予算の2倍</text><text x="326" y="378.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算週は日予算の7倍</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="354.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">総額まで。終了日より前に</text><text x="747" y="378.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">使い切ることがある</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">配分の期間</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">予算週ごと。終了日が</text><text x="326" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">なくても同じ上限</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">終了日まで（最大365日）</text><text x="747" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">終了日なしは60日</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">進みすぎたとき</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">週の枠を使い切ると、有効の</text><text x="326" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">まま次の予算週まで止まり得る</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">配信を緩め、後のために</text><text x="747" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算を残すことがある</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">入札方法</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">手動・成果を最大化</text><text x="326" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（開発者向けの記載）</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">手動の入札のみ</text><text x="747" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（開発者向けの記載）</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">消化額の表示は約7〜8時間遅れる。列の見出しで締めの時刻を確かめる</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">総額予算から日予算へは変えられるが、日予算から総額予算へは戻せない</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンター（Budget pacing・Daily budgets ほか）と開発者向けドキュメント（Bidding &amp; Budgets）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>