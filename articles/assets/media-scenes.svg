<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">顧客が触れる場面が違う</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">置き換えではなく、役割を足して考える</text><rect x="64" y="237" width="341" height="300" rx="20" fill="#F5F6F9"/><text x="92" y="292" fill="#10131A" font-size="30" font-weight="700">検索広告</text><text x="92" y="356" fill="#6B7482" font-size="25" font-weight="700">調べたい言葉が</text><text x="92" y="392" fill="#6B7482" font-size="25" font-weight="700">決まったとき</text><text x="92" y="470" fill="#4E5766" font-size="20" font-weight="500">顧客の状態</text><text x="92" y="502" fill="#10131A" font-size="21" font-weight="500">何を探すかは決まっている</text><rect x="429" y="237" width="341" height="300" rx="20" fill="#F5F6F9"/><text x="457" y="292" fill="#10131A" font-size="30" font-weight="700">SNS広告</text><text x="457" y="356" fill="#6B7482" font-size="25" font-weight="700">目的なく</text><text x="457" y="392" fill="#6B7482" font-size="25" font-weight="700">見ているとき</text><text x="457" y="470" fill="#4E5766" font-size="20" font-weight="500">顧客の状態</text><text x="457" y="502" fill="#10131A" font-size="21" font-weight="500">探していない。止められるか</text><rect x="794" y="237" width="341" height="300" rx="20" fill="#FFF1EA"/><text x="822" y="292" fill="#10131A" font-size="30" font-weight="700">ChatGPT広告</text><text x="822" y="356" fill="#9E3000" font-size="25" font-weight="700">目的を説明して</text><text x="822" y="392" fill="#9E3000" font-size="25" font-weight="700">相談しているとき</text><text x="822" y="470" fill="#4E5766" font-size="20" font-weight="500">顧客の状態</text><text x="822" y="502" fill="#10131A" font-size="21" font-weight="500">選び方がまだ決まっていない</text><rect x="64" y="560" width="1072" height="92" rx="12" fill="#10131A"/><text x="96" y="602" fill="#fff" font-size="25" font-weight="700">現時点で置き換えを勧められる材料はありません。役割を足す形で検証します。</text><text x="96" y="636" fill="#fff" font-size="21" font-weight="500">業種別の相場がなく、既存媒体と同じ土俵で比べる基準をまだ作れないためです。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月19日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>