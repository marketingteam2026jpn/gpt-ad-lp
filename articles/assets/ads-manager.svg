<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">毎日の確認は「状態→配信→消化→成果」</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">数字ごとに画面への反映の速さが違うため、速いものから見る</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">状態</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Serving か確かめる</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Not servingの理由は</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">状態にカーソルで表示</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">配信</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示・クリック・CTRは</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">約15分ごとに更新</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">入札の警告も確かめる</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">消化額</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">約7〜8時間遅れる</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">0円でも費用がないとは</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">限らない</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">成果</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">反映に24〜48時間</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">直近の合計は</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">後から変わり得る</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">止めても最大24時間ほど表示されることがあり、その分も請求される</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">報告の数字は、Spendの見出しで反映の範囲を確かめ、成果の反映を待ってから確定する</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">時間はいずれも目安で、保証ではありません。順番は当社の提案です。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの公式ヘルプ（Measure Results・Launch Campaigns・Troubleshooting・Billing）をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>