<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">テストの提案書は5つのまとまりで書く</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">通すのは「始めること」ではなく「決めた問いに答えを出すこと」</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">目的と問い</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">何が分かれば</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">次に進めるか</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">を1文で</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">背景</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">公式の事実だけ</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">確認日と出典</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">効果は約束しない</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">予算</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">必要件数から逆算</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">日予算の2倍・7倍</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">で最大額を説明</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">判断と停止</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">7・14・30日</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">続ける・直す・</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">止める・保留</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">体制と報告</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">社内と外部の分担</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">週1回の報告</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">30日後の判断会</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">必要なクリック＝判断に必要な件数÷CVR。必要な予算＝クリック×単価。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">CVRと単価は仮の値。自社の既存媒体や小さなテストの数字で置き換える。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">公式に業種横断のベンチマークはありません。他社事例は設計の参考として使います。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターと公式発表をもとに当社作成。提案書のひな型は当社の提案です。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>