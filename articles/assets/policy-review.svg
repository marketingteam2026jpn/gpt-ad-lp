<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">審査で確認される4つの段階</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">どれか1つを通っても、ほかの段階が済んだことにはならない</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">事業者の確認</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">名称・所有・関係会社</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">を実態と一致させる</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（最大7営業日）</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">業種の適格性</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">規制領域は</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">「米国以外」の列で</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">可否を確認する</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="631.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告とLPの審査</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">文・画像・LPの一致</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">OAI-AdsBotが</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">LPを読めるか</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">掲載面の判定</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">センシティブな会話</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">には出さない</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">承認後も監視が続く</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">否認されたら：理由を読む → 理由に当たる素材だけ直す → 再提出</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">誤りと考えるなら異議申し立て。アカウントの作り直しでは回避できない。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">日本の法令（景品表示法など）への適合は、OpenAIの審査とは別に確認します。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">広告ポリシーv1.6（2026年9月10日更新）とヘルプセンターをもとに当社作成。審査結果を保証するものではありません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>