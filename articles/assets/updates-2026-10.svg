<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">10月の変更で、担当ごとに確認すること</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">2026年9月25日と10月7日の公式の本文を比べた結果から</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">運用担当</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示課金を選べるか確認</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">総額→日予算は戻せない</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">初回は日付に注意</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">計測担当</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">APIの成果の合計に</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">既定でビュー経由が入る</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">集計の設定をそろえる</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">経理</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">同じ金額の請求は</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">重複とは限らない</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">しきい値は段階的</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="903.5" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">管理者</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ブランド名の変更は</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">承認まで配信停止</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">旧方式なら移行を実行</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">期限：商品フィードの旧方式のトラッキングは2026年11月5日まで</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">10月5日の発表はテスト予定・初期段階・対象の広告主への提供が中心。日本は画面で確認</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">やることは当社の提案です。使えるかは自社のアカウントの画面で確かめてください。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの公式ヘルプ・開発者向けドキュメント・発表をもとに当社作成。日付のない変更は時期不明。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>