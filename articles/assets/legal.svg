<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">法律・士業の広告の日本向けの扱い</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">国別表の「米国以外」は不可。金融のような承認制の区分もない</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">不可</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">法務サービス</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">米国以外への配信。</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">助言・代理・入管・</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">書類作成・請求など</text><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">米国のみ</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">弁護士資格が条件</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">米国の利用者向けは、</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">米国で法律業務の</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">資格があれば可</text><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">検討できる</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">法律の教育・メディア</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">法務サービスを</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">提供しない講座・</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">教材・番組</text><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">注意</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">事業者とLP</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">主な事業で判断</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">され得る。相談の</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">申込へ誘導しない</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">士業の業務が「法務サービス」に入るかは、原文に書かれていない</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">書類作成・手続きの代行は原文の例と重なる。日本向けは出せない前提で計画（当社の提案）</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの広告ポリシーv1.6と規制領域の国別表（2026年11月4日確認）をもとに当社作成。審査結果を保証しません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>