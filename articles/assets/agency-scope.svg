<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">依頼範囲を6つに分けて比べる</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">実績数ではなく、どこまで引き受けるかで選ぶ</text><text x="64" y="250" fill="#4E5766" font-size="22" font-weight="700">「やる／やらない／助言のみ」で埋めて比較する</text><rect x="64" y="272" width="341" height="132" rx="16" fill="#F5F6F9"/><text x="90" y="312" fill="#6B7482" font-size="20" font-weight="700">01</text><text x="90" y="352" fill="#10131A" font-size="26" font-weight="700">出稿準備</text><text x="90" y="382" fill="#4E5766" font-size="18" font-weight="500">国・通貨は後から変えられない</text><rect x="429" y="272" width="341" height="132" rx="16" fill="#F5F6F9"/><text x="455" y="312" fill="#6B7482" font-size="20" font-weight="700">02</text><text x="455" y="352" fill="#10131A" font-size="26" font-weight="700">文脈設計</text><text x="455" y="382" fill="#4E5766" font-size="18" font-weight="500">ヒントを誰が書くか</text><rect x="794" y="272" width="341" height="132" rx="16" fill="#FFF1EA"/><text x="820" y="312" fill="#9E3000" font-size="20" font-weight="700">03</text><text x="820" y="352" fill="#10131A" font-size="26" font-weight="700">広告制作</text><text x="820" y="382" fill="#4E5766" font-size="18" font-weight="500">遷移先の修正まで入るか</text><rect x="64" y="424" width="341" height="132" rx="16" fill="#F5F6F9"/><text x="90" y="464" fill="#6B7482" font-size="20" font-weight="700">04</text><text x="90" y="504" fill="#10131A" font-size="26" font-weight="700">計測実装</text><text x="90" y="534" fill="#4E5766" font-size="18" font-weight="500">設置代行か、手順提示か</text><rect x="429" y="424" width="341" height="132" rx="16" fill="#F5F6F9"/><text x="455" y="464" fill="#6B7482" font-size="20" font-weight="700">05</text><text x="455" y="504" fill="#10131A" font-size="26" font-weight="700">改善</text><text x="455" y="534" fill="#4E5766" font-size="18" font-weight="500">変更ログをどう残すか</text><rect x="794" y="424" width="341" height="132" rx="16" fill="#F5F6F9"/><text x="820" y="464" fill="#6B7482" font-size="20" font-weight="700">06</text><text x="820" y="504" fill="#10131A" font-size="26" font-weight="700">継続判断</text><text x="820" y="534" fill="#4E5766" font-size="18" font-weight="500">何を見て撤退を決めるか</text><rect x="64" y="588" width="1072" height="64" rx="12" fill="#10131A"/><text x="96" y="628" fill="#fff" font-size="24" font-weight="700">遷移先ページを触れるかで、改善できる範囲が構造的に変わります。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500">この媒体に「実績豊富」はまだ存在しません。実績数では比較できません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月19日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>