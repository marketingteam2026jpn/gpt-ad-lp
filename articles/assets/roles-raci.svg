<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">広告主と代理店の分担の例</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">アカウントは広告主の名義で作り、代理店を招待する形を勧める</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">広告主（自社）が主に行う</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">代理店に任せやすい</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">開設</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">作成・事業者確認・請求・招待</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">準備の支援、必要な役割を伝える</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">表現</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">価格・効果の事実確認、国内法</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">ポリシーとの照合、論点の提示</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">制作</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">内容の確認・承認</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">相談場面・ヒント・広告文・画像</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">サイト・計測</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="470.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">LP修正、タグ設置、同意の管理</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="470.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">修正点の提案、仕様の提示と検証</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">配信中</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">予算上限の承認、成果の判定</text><text x="326" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">（有効リード・受注）</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">監視、変更ログ、週次レポート</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">代理店には任せる範囲に合わせて閲覧者・メンバー・管理者を付ける。</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">1つのアカウントに管理者は最低1人。社内の管理者を必ず残す。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンターをもとに当社作成。分担は当社の提案で、契約内容によって変わります。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>