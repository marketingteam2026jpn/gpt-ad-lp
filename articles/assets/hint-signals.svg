<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">配信先を決めるのはヒントだけではない</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">4つの材料がそろって、はじめて意図が伝わる</text><text x="64" y="250" fill="#4E5766" font-size="22" font-weight="700">広告の選択に使われるもの</text><rect x="64" y="272" width="700" height="68" rx="14" fill="#EEEFFE"/><text x="92" y="302" fill="#10131A" font-size="24" font-weight="700">会話の文脈と意図</text><text x="92" y="328" fill="#4E5766" font-size="19" font-weight="500">いま何を相談しているか</text><rect x="64" y="354" width="700" height="68" rx="14" fill="#EEEFFE"/><text x="92" y="384" fill="#10131A" font-size="24" font-weight="700">遷移先ページ</text><text x="92" y="410" fill="#4E5766" font-size="19" font-weight="500">リンク先に何が書いてあるか</text><rect x="64" y="436" width="700" height="68" rx="14" fill="#EEEFFE"/><text x="92" y="466" fill="#10131A" font-size="24" font-weight="700">広告のタイトル・説明文</text><text x="92" y="492" fill="#4E5766" font-size="19" font-weight="500">広告自体が何を言っているか</text><rect x="64" y="518" width="700" height="68" rx="14" fill="#FFF1EA"/><text x="92" y="548" fill="#10131A" font-size="24" font-weight="700">コンテキストヒント</text><text x="92" y="574" fill="#4E5766" font-size="19" font-weight="500">役に立ちそうな会話の記述</text><rect x="800" y="272" width="336" height="314" rx="20" fill="#F5F6F9"/><text x="828" y="322" fill="#10131A" font-size="25" font-weight="700">できないこと</text><text x="828" y="378" fill="#6B7482" font-size="21" font-weight="700">× 完全一致キーワード</text><text x="828" y="424" fill="#6B7482" font-size="21" font-weight="700">× 特定の会話への指定</text><text x="828" y="470" fill="#6B7482" font-size="21" font-weight="700">× 配信されることの保証</text><text x="828" y="530" fill="#4E5766" font-size="19" font-weight="500">ヒントだけ直しても</text><text x="828" y="556" fill="#4E5766" font-size="19" font-weight="500">配信先が変わらないことがある</text><text x="64" y="640" fill="#4E5766" font-size="22" font-weight="500">書くのは単語ではなく、顧客が相談する場面の文。広告グループは検討段階で分けます。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月19日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>