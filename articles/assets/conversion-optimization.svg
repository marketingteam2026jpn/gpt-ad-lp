<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">成果最適化キャンペーンを作る5つの手順</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">目的・課金方式・成果イベントは、作成後にその場で変えられない</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="86.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">計測を整える</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">PixelかCAPIで</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">標準イベントが</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">届いている</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="304.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">課金方式</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">クリック課金か</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">表示課金を選ぶ</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果ごとではない</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="522.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">成果イベント</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">標準イベントを1つ</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">カスタムは不可</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">作成後は変更不可</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">予算・日程</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">地域も設定する</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">実績が集まる</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">期間と予算に</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">入札と確認</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">Bid Capは成果</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">1件への上限額</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">成果反映24〜48時間</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">成果1件ごとの課金ではない。課金は有効なクリックか表示</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">表示課金はビュー経由の成果も最適化に使う。学習期間の長さは公式資料に記載なし</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプ（Conversion-optimized Campaigns ほか）と開発者向け資料をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年11月4日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>