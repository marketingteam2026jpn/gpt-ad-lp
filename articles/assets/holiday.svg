<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">年末商戦の準備は、山の前に5つの順で</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">前の工程が終わらないと、次を確かめられない順に並べた</text><rect x="64" y="250" width="200" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">アカウント</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">事業者の確認は</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">最大7営業日</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">かかることがある</text><path d="M267 369 L279 369" stroke="#E1E4EB" stroke-width="3"/><rect x="282" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="304.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="304.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">計測</text><text x="304.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">購入を</text><text x="304.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">order_createdで</text><text x="304.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">送り、山の前に試す</text><path d="M485 369 L497 369" stroke="#E1E4EB" stroke-width="3"/><rect x="500" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="522.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="522.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">商品フィード</text><text x="522.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ホストURLか</text><text x="522.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">SFTPで自動更新</text><text x="522.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">商品は2週間で失効</text><path d="M703 369 L715 369" stroke="#E1E4EB" stroke-width="3"/><rect x="718" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="740.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="740.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">予算と日程</text><text x="740.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">予算週は日〜土</text><text x="740.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">上限は1日2倍・週7倍</text><text x="740.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">初回は日付に注意</text><path d="M921 369 L933 369" stroke="#E1E4EB" stroke-width="3"/><rect x="936" y="250" width="200" height="238" rx="20" fill="#F5F6F9"/><text x="958.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">5</text><text x="958.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">広告文とLP</text><text x="958.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">価格・特典をLPと</text><text x="958.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">同じ日に更新</text><text x="958.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">10/30から強化が自動</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">クレジットは¥35,000を使った後に発行。既定の期限は発行から90日</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">「初めて」の判定・使う期限・発行の時期は、2026年10月29日時点で未確認</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">順番は当社の提案です。各項目の数字・期間は公式ヘルプの記載です。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの年末商戦向けページ・公式ヘルプ・広告クレジットの規約をもとに当社作成。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>