<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" rx="0" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700">Pixel・CAPI・UTMは役割が違う</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500">何を、どこで、何のために測るかを分けて用意する</text><rect x="64" y="237" width="341" height="268" rx="20" fill="#FFF1EA"/><text x="92" y="290" fill="#10131A" font-size="27" font-weight="700">ブラウザ Pixel</text><text x="92" y="330" fill="#9E3000" font-size="20" font-weight="700">サイト上の行動</text><text x="92" y="392" fill="#4E5766" font-size="20" font-weight="500">例：フォーム送信・購入の完了</text><text x="92" y="424" fill="#4E5766" font-size="20" font-weight="500">媒体のレポートと最適化</text><rect x="92" y="444" width="285" height="40" rx="8" fill="#fff"/><text x="108" y="470" fill="#10131A" font-size="19" font-weight="700">ブラウザ側</text><rect x="429" y="237" width="341" height="268" rx="20" fill="#EEEFFE"/><text x="457" y="290" fill="#10131A" font-size="27" font-weight="700">Conversions API</text><text x="457" y="330" fill="#343BC0" font-size="20" font-weight="700">サーバー上の確定</text><text x="457" y="392" fill="#4E5766" font-size="20" font-weight="500">例：受注確定・審査後の承認</text><text x="457" y="424" fill="#4E5766" font-size="20" font-weight="500">oppref を保持して送る</text><rect x="457" y="444" width="285" height="40" rx="8" fill="#fff"/><text x="473" y="470" fill="#10131A" font-size="19" font-weight="700">サーバー側</text><rect x="794" y="237" width="341" height="268" rx="20" fill="#F5F6F9"/><text x="822" y="290" fill="#10131A" font-size="27" font-weight="700">UTM パラメータ</text><text x="822" y="330" fill="#6B7482" font-size="20" font-weight="700">流入の識別</text><text x="822" y="392" fill="#4E5766" font-size="20" font-weight="500">例：GA4など自社の解析</text><text x="822" y="424" fill="#4E5766" font-size="20" font-weight="500">媒体の計測の代わりにならない</text><rect x="822" y="444" width="285" height="40" rx="8" fill="#fff"/><text x="838" y="470" fill="#10131A" font-size="19" font-weight="700">自社の解析側</text><rect x="64" y="529" width="1072" height="128" rx="20" fill="#F5F6F9"/><text x="96" y="572" fill="#10131A" font-size="24" font-weight="700">レポートに出るまでの時間は、指標ごとに違う</text><text x="96" y="614" fill="#10131A" font-size="21" font-weight="700">表示・クリック・CTR</text><text x="96" y="642" fill="#4E5766" font-size="19" font-weight="500">数分</text><text x="436" y="614" fill="#10131A" font-size="21" font-weight="700">消化額</text><text x="436" y="642" fill="#4E5766" font-size="19" font-weight="500">遅れる。0でも未課金とは限らない</text><text x="776" y="614" fill="#10131A" font-size="21" font-weight="700">コンバージョン</text><text x="776" y="642" fill="#4E5766" font-size="19" font-weight="500">24〜48時間</text><text x="64" y="690" fill="#4E5766" font-size="16" font-weight="500">設定したCVイベントと送信イベントが一致しないと、受理されていても0のまま計上されません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500">株式会社Ikigai  ·  2026年9月19日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500">ads.ikigaiinc.com</text></g></svg>