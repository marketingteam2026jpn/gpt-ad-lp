<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">ChatGPT広告が表示される条件・されない条件</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">Goは有料プランだが広告の対象。広告主に会話の内容は渡らない</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">広告が表示され得る</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">広告が表示されない</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">プラン</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Free・Go</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">Plus・Pro・Business・Enterprise・Edu</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">年齢</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">18歳以上</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">18歳未満と判定されたアカウント</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">使い方</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">通常の会話</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">一時チャット、Ads-Freeを選んだ無料プラン</text><text x="747" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ChatGPT Atlas（テスト期間中）</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">ログイン</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">ログイン中</text><text x="326" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ログアウト時は全年齢向けの広告のみ</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="470.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">―</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">会話の内容</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="326" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">センシティブでない話題</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="747" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">健康・メンタルヘルス・政治など</text><rect x="64" y="552" width="1072" height="96" rx="12" fill="#10131A"/><text x="96" y="596" fill="#fff" font-size="25" font-weight="700" text-anchor="start">広告主に渡るのは表示・クリックなどの集計値だけ。</text><text x="96" y="630" fill="#fff" font-size="21" font-weight="500" text-anchor="start">会話・履歴・メモリ・氏名・メール・正確な位置・IPは渡らない。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIのヘルプセンター（Ads in ChatGPT）をもとに当社作成。地域によって提供状況は異なります。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年9月25日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>