<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">物件を扱う会社が入稿前に確認する4つのこと</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">物件そのものは広告できない。会社とサービスの訴求で組み立てる</text><rect x="64" y="250" width="254" height="238" rx="20" fill="#FFF1EA"/><text x="86.0" y="296" fill="#9E3000" font-size="30" font-weight="700" text-anchor="start">1</text><text x="86.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">物件に触れない</text><text x="86.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">物件名や価格、所在地、</text><text x="86.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">間取り、写真を</text><text x="86.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告文と画像に入れない</text><path d="M322 369 L334 369" stroke="#E1E4EB" stroke-width="3"/><rect x="336" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="358.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">2</text><text x="358.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">LPを選ぶ</text><text x="358.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">査定・相談・会社紹介</text><text x="358.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">など、特定の物件を</text><text x="358.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">載せない公開ページへ</text><path d="M594 369 L606 369" stroke="#E1E4EB" stroke-width="3"/><rect x="609" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="631.0" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">3</text><text x="631.0" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">金融は別の区分</text><text x="631.0" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">住宅ローン・保険は</text><text x="631.0" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">日本を含む米国以外は</text><text x="631.0" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">承認済みの広告主のみ</text><path d="M866 369 L878 369" stroke="#E1E4EB" stroke-width="3"/><rect x="882" y="250" width="254" height="238" rx="20" fill="#F5F6F9"/><text x="903.5" y="296" fill="#6B7482" font-size="30" font-weight="700" text-anchor="start">4</text><text x="903.5" y="350" fill="#10131A" font-size="21" font-weight="700" text-anchor="start">国内ルール</text><text x="903.5" y="404" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">宅建業法・表示規約</text><text x="903.5" y="430" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">への適合はOpenAIの</text><text x="903.5" y="456" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">審査とは別に確認する</text><rect x="64" y="516" width="1072" height="98" rx="12" fill="#10131A"/><text x="96" y="560" fill="#fff" font-size="25" font-weight="700" text-anchor="start">物件を掲載するサイトへのリンクは、広告文・画像・LPが特定の物件に触れなければ可。</text><text x="96" y="594" fill="#fff" font-size="21" font-weight="500" text-anchor="start">物件一覧・検索結果のページをどう判断するかは、原文に書かれていない。</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start">出せるかどうかは事業者の審査と広告の審査で決まります。</text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの広告ポリシーv1.6と規制領域の国別表（2026年10月7日確認）をもとに当社作成。審査結果を保証しません。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月8日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>