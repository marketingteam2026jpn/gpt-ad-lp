<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><g font-family="Yu Gothic, sans-serif"><rect x="0" y="0" width="1200" height="12" fill="#FF5A1F"/><text x="64" y="72" fill="#4E5766" font-size="22" font-weight="700" text-anchor="start">GPT広告専門店  /  実務ガイド</text><text x="64" y="145" fill="#10131A" font-size="44" font-weight="700" text-anchor="start">プラグインで、変わる操作と変わらない操作</text><text x="64" y="193" fill="#4E5766" font-size="25" font-weight="500" text-anchor="start">使えるのは、接続したユーザーの役割で許された操作だけ</text><rect x="306" y="224" width="409" height="50" rx="10" fill="#10131A"/><text x="326" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">アカウントを変えない</text><rect x="727" y="224" width="409" height="50" rx="10" fill="#FF5A1F"/><text x="747" y="257" fill="#fff" font-size="21" font-weight="700" text-anchor="start">承認してから実行</text><rect x="64" y="284" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="314.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">広告</text><rect x="306" y="284" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="314.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">案の作成・プレビュー</text><rect x="727" y="284" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="302.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">画像のアップロード、</text><text x="747" y="326.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">広告の作成・保存</text><rect x="64" y="336" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="366.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">設定</text><rect x="306" y="336" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="366.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">今の設定・状態の確認</text><rect x="727" y="336" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="354.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">設定の更新、停止・</text><text x="747" y="378.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">有効化・アーカイブ</text><rect x="64" y="388" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="418.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">分析・切り分け</text><rect x="306" y="388" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="406.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">成果の分析（売上・ROASは</text><text x="326" y="430.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">出さない）、原因の切り分け</text><rect x="727" y="388" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="418.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">（変更の操作はない）</text><rect x="64" y="440" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="470.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">改善案</text><rect x="306" y="440" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">1回・毎日・毎週の</text><text x="326" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">レビュー（提案だけ）</text><rect x="727" y="440" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="458.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">提案に沿う変更は、</text><text x="747" y="482.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">別に示して承認を求める</text><rect x="64" y="492" width="230" height="46" rx="10" fill="#F5F6F9"/><text x="82" y="522.0" fill="#10131A" font-size="18" font-weight="700" text-anchor="start">アカウント</text><rect x="306" y="492" width="409" height="46" rx="10" fill="#F5F6F9"/><text x="326" y="522.0" fill="#10131A" font-size="18" font-weight="500" text-anchor="start">ユーザー・招待中の一覧</text><rect x="727" y="492" width="409" height="46" rx="10" fill="#FFF1EA"/><text x="747" y="510.0" fill="#10131A" font-size="17" font-weight="500" text-anchor="start">招待・役割の変更・削除、</text><text x="747" y="534.0" fill="#4E5766" font-size="17" font-weight="500" text-anchor="start">ロゴの差し替え</text><rect x="64" y="556" width="1072" height="92" rx="12" fill="#10131A"/><text x="96" y="600" fill="#fff" font-size="25" font-weight="700" text-anchor="start">請求・支払い・税・本人情報・異議申し立ては、Ads Managerで直接行う</text><text x="96" y="634" fill="#fff" font-size="21" font-weight="500" text-anchor="start">承認の前に対象のアカウント・今の状態・変更後の値が示され、実行後に読み戻される</text><text x="64" y="660" fill="#4E5766" font-size="22" font-weight="500" text-anchor="start"></text><text x="64" y="686" fill="#4E5766" font-size="16" font-weight="500" text-anchor="start">OpenAIの公式ヘルプ（Use the ChatGPT Ads Manager plugin）をもとに当社作成。当社は動作を未確認。</text><path d="M64 698H1136" stroke="#E1E4EB" stroke-width="2"/><text x="64" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">株式会社Ikigai  ·  2026年10月29日時点</text><text x="895" y="735" fill="#4E5766" font-size="20" font-weight="500" text-anchor="start">ads.ikigaiinc.com</text></g></svg>